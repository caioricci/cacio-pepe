<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cacio & Pepe — Encomendas</title>
<meta name="description" content="Paninis artesanais na ciabatta da casa. Encomende para quarta ou sexta, almoço ou noite.">
<meta name="theme-color" content="#5C1824">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:image" content="https://cacioepepe.netlify.app/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="base.css">
<style>
.app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:110px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabeçalho vinho com a "pimenta" por cima; a foto da loja entra por trás quando existir */
.hero{position:relative;background:var(--hero);color:#FBF3E8;padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:26px;overflow:hidden;background-size:cover;background-position:center}
.hero.has-capa{padding-top:calc(150px + env(safe-area-inset-top,0px))}
.hero.has-capa::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,8,14,.15) 0%,rgba(60,14,22,.78) 55%,var(--hero) 100%)}
.hero::before{content:"";position:absolute;inset:0;opacity:.22;pointer-events:none;z-index:1;
  background-image:
    radial-gradient(circle at 20% 30%, #120607 1.2px, transparent 1.6px),
    radial-gradient(circle at 70% 60%, #120607 0.9px, transparent 1.3px),
    radial-gradient(circle at 40% 80%, #120607 1.6px, transparent 2px),
    radial-gradient(circle at 85% 15%, #120607 0.8px, transparent 1.2px);
  background-size:37px 41px,23px 29px,53px 47px,31px 19px}
.hero-in{position:relative;z-index:2;display:flex;flex-direction:column;gap:14px}
.id{display:flex;align-items:center;gap:16px}
.logo{width:clamp(108px,30vw,136px);height:auto;aspect-ratio:1;max-width:100%;border-radius:50%;object-fit:contain;flex:none;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand{font-family:var(--display);font-weight:400;font-size:clamp(46px,13vw,72px);line-height:.88;margin:0;letter-spacing:-.015em}
.brand span{display:block}
.id.with-logo .brand{font-size:clamp(34px,9vw,46px)}
.tag{margin:0;max-width:38ch;opacity:.92;font-size:15px}
.next{display:flex;align-items:center;gap:12px;background:rgba(251,243,232,.1);border:1px solid rgba(251,243,232,.24);border-radius:var(--r);padding:11px 14px;font-size:14px}
.next b{font-weight:700}
.next #next-txt{flex:1;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:#CDE7A8;flex:none}
.next.closed .dot{background:#F0CBC4}

/* Categorias */
.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;padding:7px 14px;border-radius:999px}
.cats a.on{background:var(--vinho);color:var(--on-vinho)}

/* Lista */
.sec{padding-top:22px}
.sec h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 4px;color:var(--vinho)}
.prod{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:14px;padding-block:18px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0;color:inherit}
.prod:last-child{border-bottom:0}
.prod h3{margin:0 0 4px;font-size:17px;font-weight:700}
.prod p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .price{margin-top:10px;font-weight:700;font-variant-numeric:tabular-nums}
.thumb{width:108px;height:108px;border-radius:var(--r);overflow:hidden;background:var(--paper);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .n{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.noimg{width:100%;height:100%;display:grid;place-items:center;font-family:var(--display);font-size:30px;color:var(--vinho);opacity:.55}
.loading,.empty{color:var(--muted);padding-block:30px}

/* Barra do carrinho */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.cartbar .btn{pointer-events:auto;width:100%;max-width:608px;margin:0 auto;display:flex;justify-content:space-between;box-shadow:var(--shadow);font-size:16px;padding:16px 18px}
.cartbar .count{background:rgba(255,255,255,.2);border-radius:999px;padding:1px 9px;font-size:13px}

/* Folhas (produto e carrinho) */
.scrim{position:fixed;inset:0;background:rgba(30,10,12,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:94vh;max-height:94dvh;border-radius:var(--r-lg) var(--r-lg) 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:var(--r-lg);max-height:90vh}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:16px;font-weight:700;flex:1;text-align:center}
.icon-btn{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.icon-btn:hover{background:var(--paper)}
.icon-btn:focus-visible{outline:2px solid var(--vinho)}
.sheet-body{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet-foot{border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center}
.sheet-foot .btn{flex:1;justify-content:space-between}

.gallery{position:relative;background:var(--paper)}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:none;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:start;max-width:100%}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px}
.dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55)}
.dots span.on{background:#fff}
.pd{display:flex;flex-direction:column;gap:6px;padding-block:18px}
.pd h3{margin:0;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1}
.pd p{margin:0;color:var(--muted)}
.pd .price{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.group{border-top:8px solid var(--paper);padding-block:16px}
.group-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.group-h b{font-size:16px}
.group-h small{display:block;color:var(--muted);font-size:13px}
.req{background:var(--ink);color:var(--surface);font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.req.picked{background:var(--pistache);color:var(--on-pistache)}
.choice{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.choice:last-child{border-bottom:0}
.choice input{width:20px;height:20px;accent-color:var(--vinho)}

/* Checkout */
.ck-sec{padding-block:18px;border-top:8px solid var(--paper);display:flex;flex-direction:column;gap:12px}
.ck-sec:first-child{border-top:0}
.ck-sec h3{margin:0;font-size:17px;font-weight:700}
.ck-sec .sub{color:var(--muted);font-size:13px;margin:-8px 0 0}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding-block:12px;border-bottom:1px solid var(--line)}
.line:last-of-type{border-bottom:0}
.line .nm{font-weight:700}
.line .meta{color:var(--muted);font-size:13px}
.line .pr{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.line .act{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.link{all:unset;cursor:pointer;color:var(--danger);font-weight:600;font-size:14px}
.link:focus-visible{outline:2px solid var(--vinho)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:15px}
.opt small{color:var(--muted);font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--vinho);box-shadow:inset 0 0 0 1px var(--vinho)}
.opt:focus-visible{outline:2px solid var(--vinho);outline-offset:2px}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.days{display:flex;flex-direction:column;gap:14px}
.day h4{margin:0 0 8px;font-size:14px;font-weight:700}
.day h4::first-letter{text-transform:uppercase}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.slot .cut{font-size:12px;color:var(--muted)}
.slot .left{font-size:12px;font-weight:700;color:var(--ok)}
.slot .left.low{color:var(--warn)}
.slot .left.none{color:var(--danger)}
.chosen{background:var(--pistache);color:var(--on-pistache);border-radius:var(--r);padding:14px 16px;font-size:15px}
.chosen b{font-weight:800}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row-cep{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:10px}
.frete{border-radius:var(--r);padding:12px 14px;font-size:14px;background:var(--paper)}
.frete b{font-variant-numeric:tabular-nums}
.frete.bad{background:var(--mortadela);color:var(--on-mortadela)}
.apartir{font-weight:500;font-size:.85em;color:var(--muted)}
.cpreco{display:block;font-size:13px;color:var(--muted);font-weight:600}
.tag-dia{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--mortadela);color:var(--on-mortadela)}
.frete.gratis{background:var(--pistache);color:var(--on-pistache)}
.frete.dica{margin-top:8px;background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.frete.dica b{color:var(--ink)}
.pay-g{display:flex;flex-direction:column;gap:8px}
.pay-g .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--vinho);background:var(--vinho);color:var(--on-vinho)}
.chip:focus-visible{outline:2px solid var(--vinho);outline-offset:2px}
.totals{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;gap:12px}
.totals .t{font-weight:800;font-size:18px;padding-top:6px;border-top:1px solid var(--line)}
.totals small{color:var(--muted)}
.err{background:var(--mortadela);color:var(--on-mortadela);border-radius:var(--r-sm);padding:11px 13px;font-size:14px;font-weight:600}
.err:empty{display:none}

/* Confirmação */
.done{padding-block:30px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.done .num{font-family:var(--display);font-size:56px;line-height:1;color:var(--vinho)}
.done h3{margin:0;font-family:var(--display);font-weight:400;font-size:28px}
.done p{margin:0;color:var(--muted);max-width:44ch}
.step{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.step h4{margin:0;font-size:16px}
.qr{align-self:center;background:#fff;padding:10px;border-radius:var(--r-sm);width:220px;max-width:100%}
.qr svg{display:block;width:100%;height:auto}
.copia{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all;background:var(--paper);border-radius:var(--r-sm);padding:10px;user-select:all}

.foot{padding-block:28px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px}
  .pix-trava .pix-corpo{filter:blur(7px);opacity:.35;pointer-events:none;user-select:none}
  .trava-msg{background:color-mix(in srgb,var(--vinho) 12%,var(--surface));color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin:8px 0}
  .pagar-btns{display:flex;flex-direction:column;gap:10px}
  .pagar-btns .btn{width:100%}
  .btn-apple{background:#000;color:#fff;border-color:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-weight:600;font-size:17px;letter-spacing:-.01em}
  .btn-apple .ap{margin-left:.3em;font-size:1.05em}
  .prox{display:inline-block;background:var(--vinho);color:var(--on-vinho);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;margin-right:6px;vertical-align:2px}
  .mais-datas{width:100%;margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <header class="hero" id="hero">
    <div class="hero-in gutter">
      <div class="id" id="id">
        <img class="logo" id="logo" src="logo.png" alt="" width="136" height="136">
        <h1 class="sr">Cacio &amp; Pepe</h1>
      </div>
      <p class="tag" id="aviso">Paninis artesanais na ciabatta da casa.</p>
      <div class="next" id="next"><span class="dot"></span><span id="next-txt">Carregando a agenda…</span></div>
    </div>
  </header>

  <nav class="cats gutter" id="cats" aria-label="Categorias"></nav>
  <main class="gutter" id="menu"><p class="loading">Carregando cardápio…</p></main>
  <footer class="foot gutter" id="foot"></footer>
</div>

<div class="cartbar" id="cartbar" hidden>
  <button class="btn btn-primary" id="open-cart" type="button">
    <span><span class="count" id="cart-count">0</span>&nbsp; Ver carrinho</span><span id="cart-total">R$ 0,00</span>
  </button>
</div>

<!-- Folha do produto -->
<div class="scrim" id="pd-scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pd-title">
    <div class="sheet-head"><button class="icon-btn" type="button" data-close aria-label="Fechar">✕</button><h2>Detalhe do produto</h2><span style="width:38px"></span></div>
    <div class="sheet-body" id="pd-body"></div>
    <div class="sheet-foot">
      <div class="stepper"><button type="button" id="pd-minus" aria-label="Diminuir">−</button><output id="pd-qty">1</output><button type="button" id="pd-plus" aria-label="Aumentar">+</button></div>
      <button class="btn btn-primary" type="button" id="pd-add"><span>Adicionar</span><span id="pd-price"></span></button>
    </div>
  </div>
</div>

<!-- Folha do carrinho / checkout -->
<div class="scrim" id="ck-scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ck-title">
    <div class="sheet-head"><button class="icon-btn" type="button" data-close aria-label="Voltar">←</button><h2 id="ck-title">Meu pedido</h2><span style="width:38px"></span></div>
    <div class="sheet-body" id="ck-body"></div>
    <div class="sheet-foot" id="ck-foot">
      <button class="btn btn-primary" type="button" id="ck-send"><span>Enviar pedido</span><span id="ck-total"></span></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script src="supabase.js"></script>
<script src="qrcode.js"></script>
<script src="config.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const { brl, esc } = U;
  let CFG = null, PRODUTOS = [], SLOTS = [], LOJA = null, GRATIS = [];
  const CART_KEY = "cacio_carrinho_v1", DADOS_KEY = "cacio_dados_v1";
  const ls = { get(k,d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
  let cart = ls.get(CART_KEY, []);
  const saveCart = () => ls.set(CART_KEY, cart);
  // dados do cliente ficam no aparelho dele para a próxima compra
  const D = Object.assign({ nome:"", tel:"", cep:"", rua:"", num:"", bairro:"", cidade:"", uf:"", comp:"", troco:"", obs:"" }, ls.get(DADOS_KEY, {}));
  D.troco = ""; D.obs = "";
  const saveDados = () => ls.set(DADOS_KEY, { nome:D.nome, tel:D.tel, cep:D.cep, rua:D.rua, num:D.num, bairro:D.bairro, cidade:D.cidade, uf:D.uf, comp:D.comp });
  const ck = { modo:null, slot:null, pag:null, err:"", frete:{ estado:"vazio" } };

  function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

  // ---------- dados ----------
  async function carregar(){
    const [c, p, g] = await Promise.all([
      sb.from("config").select("*").eq("id",1).single(),
      sb.from("produtos").select("*").eq("ativo",true).order("ordem").order("nome"),
      sb.from("frete_gratis").select("*").eq("ativo",true).order("ordem"),
    ]);
    GRATIS = (g.data || []);
    if (c.error || p.error) { $("menu").innerHTML = `<p class="empty">Não conseguimos carregar o cardápio agora. Atualize a página em instantes.</p>`; return; }
    CFG = c.data; PRODUTOS = p.data;
    aplicarMarca();
    cart = cart.filter(l => PRODUTOS.some(p => p.id === l.produto_id)); saveCart();
    renderMenu(); renderCartBar();
    await atualizarAgenda();
    renderMenu(); // com a agenda carregada, a etiqueta de dias mostra os horários regionais
  }
  const PG_LINK = "Cartão pelo link";
  // iPhone/Mac com Safari: a página da InfinitePay mostra o Apple Pay, então a gente já anuncia
  const TEM_APPLE_PAY = (() => { try { return !!window.ApplePaySession && ApplePaySession.canMakePayments(); } catch(e) { return false; } })();
  function aplicarMarca(){
    if (CFG.aviso) $("aviso").textContent = CFG.aviso;
    if (CFG.logo_url) $("logo").src = CFG.logo_url;
    if (CFG.capa_url) { $("hero").style.backgroundImage = `url("${CFG.capa_url.replace(/"/g,"%22")}")`; $("hero").classList.add("has-capa"); }
    const pags = [...(CFG.pix_chave?["Pix"]:[]), ...(CFG.infinitepay_handle?[PG_LINK]:[]), ...CFG.pagamentos];
    $("foot").innerHTML = `<span>Retirada: ${esc(endPub())}</span><span>Pagamento: ${esc(pags.join(", "))}</span>`;
    if (CFG.loja_lat != null && CFG.loja_lng != null) LOJA = { lat:CFG.loja_lat, lng:CFG.loja_lng };
  }
  async function atualizarAgenda(){
    const { data, error } = await sb.rpc("disponibilidade", { p_dias: 14 });
    if (error) { $("next-txt").textContent = "Não foi possível carregar a agenda."; return; }
    SLOTS = data || [];
    const nx = SLOTS.find(s => s.livres > 0 && !s.cidades?.length);
    const box = $("next");
    if (CFG?.vendas_pausadas || !nx) {
      box.classList.add("closed");
      $("next-txt").innerHTML = CFG?.vendas_pausadas ? "<b>Encomendas pausadas</b> no momento." : "<b>Agenda lotada.</b> Novas datas abrem em breve.";
    } else {
      box.classList.remove("closed");
      $("next-txt").innerHTML = nx.modo === "extra"
        ? `<b>Últimas unidades ${U.quando(nx.data)}</b>, ${esc(nx.turno.toLowerCase())}`
        : `Próxima entrega: <b>${U.DIAS[U.parseData(nx.data).dow]} ${U.ddmm(nx.data)}, ${esc(nx.turno.toLowerCase())}</b>. Pedidos até ${U.quando(nx.corte)}, ${U.hora(nx.corte)}.`;
    }
    if (!$("ck-scrim").hidden && !ck.finalizado) renderCheckout();
  }

  // ---------- cardápio ----------
  function renderMenu(){
    const cats = [...new Set(PRODUTOS.map(p => p.categoria))];
    if (!PRODUTOS.length) { $("menu").innerHTML = `<p class="empty">O cardápio está sendo atualizado.</p>`; $("cats").hidden = true; return; }
    $("cats").innerHTML = cats.map((c,i)=>`<a href="#cat-${i}" class="${i?"":"on"}">${esc(c)}</a>`).join("");
    $("cats").hidden = cats.length < 2;
    $("menu").innerHTML = cats.map((c,i)=>`<section class="sec" id="cat-${i}"><h2>${esc(c)}</h2>${
      PRODUTOS.filter(p=>p.categoria===c).map(p=>`<button type="button" class="prod" data-id="${p.id}">
        <div><h3>${esc(p.nome)}</h3><p>${esc(p.descricao)}</p><div class="price">${OPC.aPartir(p)!=null?`<span class="apartir">a partir de</span> ${brl(OPC.aPartir(p))}`:brl(p.preco)}</div>${p.dias_semana?.length?`<span class="tag-dia">${esc(tagDias(p))}</span>`:""}</div>
        <div class="thumb">${p.fotos.length?`<img src="${esc(p.fotos[0])}" alt="" loading="lazy">${p.fotos.length>1?`<span class="n">${p.fotos.length} fotos</span>`:""}`:`<div class="noimg">${esc(p.nome[0])}</div>`}</div>
      </button>`).join("")}</section>`).join("");
    document.querySelectorAll(".prod").forEach(b => b.onclick = () => abrirProduto(b.dataset.id));
    document.querySelectorAll(".cats a").forEach(a => a.onclick = () => { document.querySelectorAll(".cats a").forEach(x=>x.classList.toggle("on",x===a)); });
  }

  // ---------- produto ----------
  let pd = null;
  function abrirProduto(id){
    const p = PRODUTOS.find(x=>x.id===id); if(!p) return;
    pd = { p, qty:1, esc:{}, obs:"" };
    const fotos = p.fotos || [];
    $("pd-body").innerHTML = `
      ${fotos.length?`<div class="gallery"><div class="slides" id="slides">${fotos.map(f=>`<img src="${esc(f)}" alt="${esc(p.nome)}">`).join("")}</div>${fotos.length>1?`<div class="dots" id="dots">${fotos.map((_,i)=>`<span class="${i?"":"on"}"></span>`).join("")}</div>`:""}</div>`:""}
      <div class="pd gutter"><h3 id="pd-title">${esc(p.nome)}</h3><p>${esc(p.descricao)}</p><div class="price" id="pd-preco">${OPC.aPartir(p)!=null?`<span class="apartir">a partir de</span> ${brl(OPC.aPartir(p))}`:brl(p.preco)}</div>${p.dias_semana?.length?`<span class="tag-dia">${esc(tagDias(p))}</span>`:""}</div>
      ${(p.opcoes||[]).map((g,gi)=>`<div class="group gutter" role="radiogroup" aria-labelledby="g-${gi}">
        <div class="group-h"><div><b id="g-${gi}">${esc(g.nome)}</b><small>Escolha 1 opção</small></div>${g.obrigatorio?`<span class="req" id="req-${gi}">Obrigatório</span>`:""}</div>
        ${(g.escolhas||[]).map((e,ei)=>`<label class="choice"><span>${esc(OPC.nome(e))}${OPC.preco(e)!=null?`<small class="cpreco">${brl(OPC.preco(e))}${OPC.unid(e)>1?` · ${brl(OPC.preco(e)/OPC.unid(e))} cada`:""}</small>`:""}</span><input type="radio" name="g${gi}" id="g${gi}-${ei}" value="${esc(OPC.nome(e))}" data-g="${gi}"></label>`).join("")}
      </div>`).join("")}
      <div class="group gutter"><div class="field"><label for="pd-obs">Observações</label><textarea class="input" id="pd-obs" maxlength="200" placeholder="${p.categoria==="Paninis"?"Ex: sem rúcula":"Alguma observação?"}"></textarea></div></div>`;
    document.querySelectorAll("#pd-body input[type=radio]").forEach(r => r.onchange = () => { pd.esc[r.dataset.g] = r.value; const q=$("req-"+r.dataset.g); if(q){q.textContent="Escolhido";q.classList.add("picked");} pdUpdate(); });
    $("pd-obs").oninput = e => pd.obs = e.target.value;
    const sl = $("slides");
    if (sl && $("dots")) sl.onscroll = () => { const i=Math.round(sl.scrollLeft/sl.clientWidth); [...$("dots").children].forEach((d,k)=>d.classList.toggle("on",k===i)); };
    pdUpdate(); abrir("pd-scrim");
  }
  function pdFaltando(){ return (pd.p.opcoes||[]).findIndex((g,gi)=>g.obrigatorio && !pd.esc[gi]); }
  function pdUpdate(){
    $("pd-qty").textContent = pd.qty;
    const opc = (pd.p.opcoes||[]).map((g,gi)=>pd.esc[gi]?`${g.nome}: ${pd.esc[gi]}`:"").filter(Boolean).join("; ");
    const un = OPC.linha(pd.p, opc).preco;
    $("pd-price").textContent = brl(un*pd.qty);
    if (OPC.aPartir(pd.p)!=null && pdFaltando()<0) $("pd-preco").textContent = brl(un);
    $("pd-add").setAttribute("aria-disabled", String(pdFaltando()>=0));
  }
  $("pd-minus").onclick = () => { pd.qty=Math.max(1,pd.qty-1); pdUpdate(); };
  $("pd-plus").onclick  = () => { pd.qty=Math.min(20,pd.qty+1); pdUpdate(); };
  $("pd-add").onclick = () => {
    const f = pdFaltando();
    if (f>=0) { toast(`Escolha o ${pd.p.opcoes[f].nome.toLowerCase()} para continuar.`); document.getElementById("g-"+f).scrollIntoView({behavior:"smooth",block:"center"}); return; }
    const opcao = (pd.p.opcoes||[]).map((g,gi)=>pd.esc[gi]?`${g.nome}: ${pd.esc[gi]}`:"").filter(Boolean).join("; ");
    const obs = pd.obs.trim();
    const ex = cart.find(l=>l.produto_id===pd.p.id && l.opcao===opcao && l.obs===obs);
    if (ex) ex.qtd = Math.min(20, ex.qtd+pd.qty); else cart.push({ produto_id:pd.p.id, opcao, obs, qtd:pd.qty });
    saveCart(); renderCartBar(); fechar("pd-scrim"); toast("Adicionado ao carrinho");
  };

  // ---------- carrinho ----------
  const prod = id => PRODUTOS.find(p=>p.id===id);
  const precoLinha = l => OPC.linha(prod(l.produto_id), l.opcao).preco;
  const subtotal = () => cart.reduce((a,l)=>a+(prod(l.produto_id) ? precoLinha(l) : 0)*l.qtd,0);
  const paes = () => cart.reduce((a,l)=>{ const p=prod(l.produto_id); return a+(p?.paes_por_unidade??1)*OPC.linha(p,l.opcao).unid*l.qtd; },0);
  const nItens = () => cart.reduce((a,l)=>a+l.qtd,0);
  // mesma conta do banco (o banco é quem decide o valor final)
  function calcTaxa(km){
    if (CFG.frete_modo === "fixo") return Number(CFG.taxa_entrega||0);
    const v = Math.max(Number(CFG.frete_min), Number(CFG.frete_base) + Number(CFG.frete_km) * Math.round(km*10)/10);
    return Math.ceil(v*2)/2;
  }
  // ---------- entrega grátis ----------
  const norm = t => U.semAcento(t).toLowerCase().replace(/\s+/g," ").trim();
  function bateLocal(g){
    const cep = (D.cep||"").replace(/\D/g,"");
    if (D.bairro && (g.bairros||[]).some(b => norm(b) === norm(D.bairro))) return true;
    if (cep && (g.ceps||[]).includes(cep)) return true;
    const cli = ck.frete.cli;
    if (cli && g.lat != null && g.raio_km != null && GEO.linhaReta(cli, { lat:g.lat, lng:g.lng }) <= Number(g.raio_km)) return true;
    return false;
  }
  const janelaAtual = () => ck.slot ? ck.slot.split("|")[1] : null;
  const valeNaJanela = g => !(g.janelas||[]).length || (janelaAtual() && g.janelas.includes(janelaAtual()));
  function gratis(){ if (ck.modo !== "Entrega") return null; return GRATIS.find(g => bateLocal(g) && valeNaJanela(g)) || null; }
  // lugar tem grátis, mas não no horário escolhido (ex: PUC só à noite)
  function gratisOutroHorario(){ if (ck.modo !== "Entrega" || gratis()) return null; return GRATIS.find(g => bateLocal(g) && !valeNaJanela(g)) || null; }
  function nomesJanelas(ids){ return ids.map(id => { const s = SLOTS.find(x=>x.janela_id===id); return s ? `${U.DIAS[s.dia_semana]} ${s.turno.toLowerCase()}` : id; }).filter((v,i,a)=>a.indexOf(v)===i).join(" e "); }
  // PUC e outros pontos: encontra no mapa uma vez
  let gratisGeo = false;
  async function localizarPontosGratis(){
    if (gratisGeo) return; gratisGeo = true;
    for (const g of GRATIS) if (g.lat == null && g.endereco && g.raio_km != null) {
      const c = await GEO.coords({ livre: g.endereco }); if (c) { g.lat = c.lat; g.lng = c.lng; }
    }
  }

  function taxa(){
    if (ck.modo !== "Entrega") return 0;
    const rg = regional(); if (rg) return rg.taxa_fixa != null ? Number(rg.taxa_fixa) : 0;
    if (gratis()) return 0;
    if (CFG.frete_modo === "fixo") return Number(CFG.taxa_entrega||0);
    return ck.frete.estado === "ok" ? ck.frete.taxa : 0;
  }
  function renderCartBar(){
    const n = nItens(); $("cartbar").hidden = !n;
    $("cart-count").textContent = n; $("cart-total").textContent = brl(subtotal());
  }
  $("open-cart").onclick = () => { ck.err=""; ck.finalizado=false; $("ck-title").textContent="Meu pedido"; renderCheckout(); abrir("ck-scrim"); atualizarAgenda(); };

  function endPub(){ return (CFG.endereco_publico || CFG.endereco_retirada.replace(/,\s*\d+[A-Za-z]?\b/, "")).trim(); }
  // "Entrega só às sextas (aos sábados, só Rio Claro e Piracicaba)"
  function tagDias(p){
    const reg = {}; // dia -> cidades, quando todos os horários daquele dia são regionais
    for (const d of p.dias_semana) {
      const ss = SLOTS.filter(s => s.dia_semana === d);
      if (ss.length && ss.every(s => s.cidades?.length)) reg[d] = [...new Set(ss.flatMap(s => s.cidades))];
    }
    const normais = p.dias_semana.filter(d => !reg[d]);
    let t = normais.length ? `Entrega só ${diasFrase(normais)}` : "";
    const extra = Object.entries(reg).map(([d, cs]) => `${diasFrase([+d])}, só ${cs.join(" e ")}`).join("; ");
    if (extra) t = t ? `${t} (${extra})` : `Entrega ${extra}`;
    return t;
  }
  function diasFrase(ds){ return ds.slice().sort().map(d => (d===0||d===6 ? "aos " : "às ") + U.DIAS[d] + "s").join(" e ").replace(/ e (aos|às) /g, " e "); }
  // dias em que todos os itens do carrinho podem ser entregues (null = qualquer dia)
  function restricoes(){ return cart.map(l => prod(l.produto_id)).filter(p => p && p.dias_semana?.length); }
  function slotCompat(s){ return restricoes().every(p => p.dias_semana.includes(s.dia_semana)) && (!s.cidades?.length || ck.modo === "Entrega"); }
  // horários regionais (ex: sábado só para Rio Claro e Piracicaba)
  const nrm = t => U.semAcento(t).toLowerCase().trim();
  const cidadesTxt = s => s.cidades.join(" e ");
  const cidadeOk = s => !s.cidades?.length || s.cidades.some(c => nrm(c) === nrm(D.cidade));
  function slotSel(){ return ck.slot ? SLOTS.find(s => s.data+"|"+s.janela_id === ck.slot) : null; }
  function regional(){ const s = slotSel(); return s && s.cidades?.length && ck.modo === "Entrega" ? s : null; }
  function slotInfo(s){
    const need = paes();
    if (s.cidades?.length && D.cidade.trim() && !cidadeOk(s)) return { ok:false, txt:`Só ${cidadesTxt(s)}`, cls:"none" };
    if (s.livres <= 0) return { ok:false, txt:"Esgotado", cls:"none" };
    if (s.livres < need) return { ok:false, txt:`Só ${s.livres} disponíve${s.livres>1?"is":"l"}`, cls:"none" };
    if (s.livres <= 3) return { ok:true, txt:`Últimas ${s.livres}`, cls:"low" };
    return { ok:true, txt:"Disponível", cls:"" };
  }

  // ---------- frete ----------
  let freteSeq = 0;
  async function lojaCoords(){
    if (LOJA) return LOJA;
    LOJA = await GEO.coords({ livre: CFG.endereco_retirada.replace(/\s*[–-]\s*/g, ", ") });
    return LOJA;
  }
  async function calcularFrete(){
    if (!D.rua || !D.num || !D.cidade) { ck.frete = { estado:"vazio" }; renderFrete(); return; }
    const seq = ++freteSeq;
    ck.frete = { estado:"calc" }; renderFrete();
    const [loja, cli] = await Promise.all([ lojaCoords(), GEO.coords({ rua:D.rua, numero:D.num, cidade:D.cidade, uf:D.uf, cep:D.cep }) ]);
    if (seq !== freteSeq) return;
    await localizarPontosGratis();
    if (!loja || !cli) { ck.frete = { estado:"combinar", cli }; renderFrete(); return; }
    const km = await GEO.km(loja, cli);
    if (seq !== freteSeq) return;
    if (Number(CFG.frete_raio_km) > 0 && km > Number(CFG.frete_raio_km)) { ck.frete = { estado:"fora", km, cli }; renderFrete(); return; }
    ck.frete = { estado:"ok", km, cli, taxa: calcTaxa(km) }; renderFrete();
  }
  function freteHTML(){
    const rg = regional();
    if (rg) {
      if (D.cidade.trim() && !cidadeOk(rg)) return `<div class="frete bad">Esse dia é só para entregas em <b>${esc(cidadesTxt(rg))}</b>. Escolha outra data.</div>`;
      return `<div class="frete">Entrega em ${esc(D.cidade.trim() || cidadesTxt(rg))}: ${rg.taxa_fixa!=null?`<b>${brl(rg.taxa_fixa)}</b>`:"taxa combinada no WhatsApp"}</div>`;
    }
    const g = gratis();
    if (g) return `<div class="frete gratis">Entrega grátis · <b>${esc(g.nome)}</b></div>`;
    const o = gratisOutroHorario();
    const dica = o ? `<div class="frete dica">Nesse endereço a entrega é grátis em: <b>${esc(nomesJanelas(o.janelas))}</b>.</div>` : "";
    return freteBase() + dica;
  }
  function freteBase(){
    if (CFG.frete_modo === "fixo") return Number(CFG.taxa_entrega)>0 ? `<div class="frete">Taxa de entrega: <b>${brl(CFG.taxa_entrega)}</b></div>` : "";
    const f = ck.frete;
    if (f.estado==="calc") return `<div class="frete">Calculando a entrega…</div>`;
    if (f.estado==="ok") return `<div class="frete">Entrega estimada: <b>${brl(f.taxa)}</b> (${f.km.toFixed(1).replace(".",",")} km)</div>`;
    if (f.estado==="fora") return `<div class="frete bad">Esse endereço fica a ${f.km.toFixed(1).replace(".",",")} km, fora da nossa área de entrega (até ${String(CFG.frete_raio_km).replace(".",",")} km). Escolha retirada ou fale com a gente.</div>`;
    if (f.estado==="combinar") return `<div class="frete bad">Não conseguimos localizar esse endereço no mapa. Você pode enviar o pedido e a taxa de entrega é combinada no WhatsApp.</div>`;
    return `<div class="frete">Preencha CEP e número para calcular a entrega.</div>`;
  }
  function renderFrete(){
    const el = $("frete-box"); if (el) el.innerHTML = freteHTML();
    const tt = $("totals"); if (tt) tt.innerHTML = totaisHTML();
    $("ck-total").textContent = brl(subtotal()+taxa());
  }
  function totaisHTML(){
    const f = ck.frete; let linhaEnt = "";
    const rg = regional();
    if (rg) linhaEnt = `<div><span>Entrega</span><span>${rg.taxa_fixa!=null?brl(rg.taxa_fixa):"A combinar"}</span></div>`;
    else if (ck.modo==="Entrega") {
      linhaEnt = gratis() ? `<div><span>Entrega</span><span>Grátis</span></div>`
        : CFG.frete_modo==="fixo" ? `<div><span>Entrega</span><span>${taxa()>0?brl(taxa()):"Grátis"}</span></div>`
        : f.estado==="ok" ? `<div><span>Entrega <small>(estimada)</small></span><span>${brl(f.taxa)}</span></div>`
        : `<div><span>Entrega</span><span><small>${f.estado==="combinar"?"a combinar":"—"}</small></span></div>`;
    }
    return `<div><span>Subtotal</span><span>${brl(subtotal())}</span></div>${linhaEnt}<div class="t"><span>Total</span><span>${brl(subtotal()+taxa())}</span></div>`;
  }

  // ---------- checkout ----------
  function renderCheckout(){
    if (!cart.length) {
      $("ck-body").innerHTML = `<div class="gutter done"><h3>Seu carrinho está vazio</h3><p>Escolha um panini no cardápio para começar.</p><button class="btn btn-primary" type="button" data-close>Ver cardápio</button></div>`;
      $("ck-foot").hidden = true;
      $("ck-body").querySelector("[data-close]").onclick = () => fechar("ck-scrim");
      return;
    }
    $("ck-foot").hidden = false;
    if (ck.slot && !SLOTS.some(s=>s.data+"|"+s.janela_id===ck.slot && slotInfo(s).ok && slotCompat(s))) ck.slot = null;
    const days = {};
    const SLOTS_OK = SLOTS.filter(slotCompat);
    SLOTS_OK.forEach(s => (days[s.data] ||= []).push(s));
    const restr = restricoes();
    const sel = SLOTS.find(s=>s.data+"|"+s.janela_id===ck.slot);
    // mostra só a data aberta mais próxima (e a escolhida); o resto fica em "Ver mais datas"
    const diasLista = Object.entries(days);
    const iPrimeiro = Math.max(0, diasLista.findIndex(([,ss]) => ss.some(s=>slotInfo(s).ok)));
    const diasVisiveis = ck.maisDatas ? diasLista : diasLista.filter(([d],i) => i===iPrimeiro || (sel && sel.data===d));
    const escondidas = diasLista.length - diasVisiveis.length;
    const onde = ck.modo==="Entrega" ? "entrega" : "retirada";
    const temPix = !!CFG.pix_chave;
    const v = k => esc(D[k]);

    $("ck-body").innerHTML = `
      <div class="ck-sec gutter">
        <h3>Itens</h3>
        <div>${cart.map((l,i)=>{ const p=prod(l.produto_id); return `<div class="line">
          <div><div class="nm">${esc(p.nome)}</div>${l.opcao?`<div class="meta">${esc(l.opcao)}</div>`:""}${l.obs?`<div class="meta">Obs: ${esc(l.obs)}</div>`:""}</div>
          <div class="pr">${brl(precoLinha(l)*l.qtd)}</div>
          <div class="act"><button class="link" type="button" data-rm="${i}">Remover</button>
            <div class="stepper"><button type="button" data-dec="${i}" aria-label="Diminuir">−</button><output>${l.qtd}</output><button type="button" data-inc="${i}" aria-label="Aumentar">+</button></div></div>
        </div>`;}).join("")}</div>
        <button class="btn btn-ghost" type="button" data-close>Adicionar mais itens</button>
      </div>

      <div class="ck-sec gutter">
        <h3>Como você quer receber?</h3>
        <div class="seg">
          <button type="button" class="opt" id="m-ent" aria-pressed="${ck.modo==="Entrega"}"><b>Entrega</b><small>${CFG.frete_modo==="fixo"?(Number(CFG.taxa_entrega)>0?`Taxa ${brl(CFG.taxa_entrega)}`:"No seu endereço"):(GRATIS.find(g=>!g.janelas.length&&g.bairros.length)?`Grátis: ${esc(GRATIS.find(g=>!g.janelas.length&&g.bairros.length).bairros.join(" e "))}`:"Taxa pela distância")}</small></button>
          <button type="button" class="opt" id="m-ret" aria-pressed="${ck.modo==="Retirada"}"><b>Retirada</b><small>${esc(endPub().split(/[–,]/)[0])}</small></button>
        </div>
      </div>

      ${ck.modo?`<div class="ck-sec gutter">
        <h3>Para quando?</h3>
        <p class="sub">Só aparecem as datas com encomendas abertas${paes()?` e pão para o seu pedido (${paes()} ${paes()>1?"ciabattas":"ciabatta"})`:""}.</p>
        ${restr.length?`<div class="frete dica">${restr.map(p=>`<b>${esc(p.nome)}</b> sai só ${diasFrase(p.dias_semana)}`).join("; ")}, por isso só aparecem esses dias.</div>`:""}
        ${CFG.vendas_pausadas||!SLOTS.length?`<p class="err">Não há datas abertas agora. Volte mais tarde ou fale com a gente no WhatsApp.</p>`:
        !SLOTS_OK.length?`<p class="err">Não há ${diasFrase([...new Set(restr.flatMap(p=>p.dias_semana))]).replace(/^(às|aos) /,"")} abertas agora. Tire do carrinho o que só sai nesse dia ou fale com a gente no WhatsApp.</p>`:
        `<div class="days">${diasVisiveis.map(([d,ss],i)=>`<div class="day"><h4>${!ck.maisDatas&&i===0&&diasLista[iPrimeiro][0]===d?`<span class="prox">Próxima data</span> `:""}${U.diaLongo(d)}</h4><div class="slots">${ss.map(s=>{const k=s.data+"|"+s.janela_id; const inf=slotInfo(s); return `
          <button type="button" class="opt slot" data-slot="${k}" aria-pressed="${ck.slot===k}" ${inf.ok?"":"disabled"}>
            <b>${esc(s.turno)}${s.horario?` · ${esc(s.horario)}`:""}</b>
            <span class="cut">${s.modo==="extra"?"Pão pronto, saída hoje":`Pedidos até ${U.quando(s.corte)}, ${U.hora(s.corte)}`}</span>
            ${s.cidades?.length?`<span class="cut"><b>Só entregas em ${esc(cidadesTxt(s))}</b></span>`:""}
            <span class="left ${inf.cls}">${inf.txt}</span>
          </button>`;}).join("")}</div></div>`).join("")}</div>
        ${escondidas>0||ck.maisDatas&&diasLista.length>1?`<button class="btn btn-ghost mais-datas" type="button" id="mais-datas">${ck.maisDatas?"Mostrar só a próxima data":`Ver mais datas (${escondidas})`}</button>`:""}`}
        ${sel?`<div class="chosen">Seu pedido será ${ck.modo==="Entrega"?"entregue":"retirado"} <b>${U.diaLongo(sel.data)}</b>, ${/^almo/i.test(sel.turno)?"no":"à"} <b>${esc(sel.turno.toLowerCase())}</b>${sel.horario?` (${esc(sel.horario)})`:""}.</div>`:""}
      </div>

      <div class="ck-sec gutter">
        <h3>Seus dados</h3>
        <div class="field"><label for="d-nome">Nome e sobrenome</label><input class="input" id="d-nome" data-d="nome" autocomplete="name" maxlength="80" value="${v("nome")}"></div>
        <div class="field"><label for="d-tel">Celular com DDD</label><input class="input" id="d-tel" data-d="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(19) 90000-0000" maxlength="20" value="${v("tel")}"></div>
        ${ck.modo==="Entrega"?`
        <div class="row-cep">
          <div class="field"><label for="d-cep">CEP</label><input class="input" id="d-cep" data-d="cep" inputmode="numeric" autocomplete="postal-code" placeholder="13010-000" maxlength="9" value="${v("cep")}"></div>
          <div class="field"><label for="d-num">Número</label><input class="input" id="d-num" data-d="num" inputmode="numeric" maxlength="10" value="${v("num")}"></div>
        </div>
        <div class="field"><label for="d-rua">Rua</label><input class="input" id="d-rua" data-d="rua" autocomplete="address-line1" maxlength="120" value="${v("rua")}"></div>
        <div class="row2">
          <div class="field"><label for="d-bairro">Bairro</label><input class="input" id="d-bairro" data-d="bairro" maxlength="60" value="${v("bairro")}"></div>
          <div class="field"><label for="d-cidade">Cidade</label><input class="input" id="d-cidade" data-d="cidade" autocomplete="address-level2" maxlength="60" value="${v("cidade")}"></div>
        </div>
        <div class="field"><label for="d-comp">Complemento e referência (opcional)</label><input class="input" id="d-comp" data-d="comp" maxlength="100" placeholder="Apto, bloco, ponto de referência" value="${v("comp")}"></div>
        <div id="frete-box">${freteHTML()}</div>`:
        `<div class="frete">Retirada em <b>${esc(endPub())}</b>. O número a gente manda no WhatsApp.</div>`}
      </div>

      <div class="ck-sec gutter">
        <h3>Pagamento</h3>
        ${temPix||CFG.infinitepay_handle?`<div class="pay-g"><span class="lbl">Pagar agora</span><div class="chips">${temPix?`<button type="button" class="chip" data-pag="Pix" aria-pressed="${ck.pag==="Pix"}">Pix</button>`:""}${CFG.infinitepay_handle?`<button type="button" class="chip" data-pag="${PG_LINK}" aria-pressed="${ck.pag===PG_LINK}">${TEM_APPLE_PAY?"Apple Pay ou cartão":"Cartão (crédito ou débito)"}</button>`:""}</div></div>`:""}
        <div class="pay-g"><span class="lbl">Pagar na ${onde}</span><div class="chips">${CFG.pagamentos.map(f=>`<button type="button" class="chip" data-pag="${esc(f)}" aria-pressed="${ck.pag===f}">${esc(f)}</button>`).join("")}</div></div>
        ${ck.pag==="Pix"?`<p class="sub" style="margin:0">Depois de enviar, aparecem o QR Code e o Pix copia e cola com o valor certo.</p>`:""}
        ${ck.pag===PG_LINK?`<p class="sub" style="margin:0">Depois de enviar, você paga online ${TEM_APPLE_PAY?"com Apple Pay ou cartão":"com cartão de crédito ou débito"} numa página segura da InfinitePay. A confirmação chega pra gente na hora.</p>`:""}
        ${ck.pag==="Dinheiro"?`<div class="field"><label for="d-troco">Troco para quanto? (opcional)</label><input class="input" id="d-troco" data-d="troco" inputmode="decimal" maxlength="20" placeholder="Ex: 100" value="${v("troco")}"></div>`:""}
        <div class="field"><label for="d-obs">Observação para o pedido (opcional)</label><textarea class="input" id="d-obs" data-d="obs" maxlength="500">${v("obs")}</textarea></div>
      </div>`:""}

      <div class="ck-sec gutter">
        <div class="totals" id="totals">${totaisHTML()}</div>
        <div class="err" id="ck-err" role="alert">${esc(ck.err||"")}</div>
      </div>`;

    const body = $("ck-body");
    body.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ cart.splice(+b.dataset.rm,1); saveCart(); renderCartBar(); renderCheckout(); });
    body.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{ const l=cart[+b.dataset.dec]; l.qtd--; if(l.qtd<1) cart.splice(+b.dataset.dec,1); saveCart(); renderCartBar(); renderCheckout(); });
    body.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{ const l=cart[+b.dataset.inc]; l.qtd=Math.min(20,l.qtd+1); saveCart(); renderCartBar(); renderCheckout(); });
    $("m-ent").onclick=()=>{ ck.modo="Entrega"; ck.err=""; renderCheckout(); if (ck.frete.estado==="vazio") calcularFrete(); };
    $("m-ret").onclick=()=>{ ck.modo="Retirada"; ck.err=""; renderCheckout(); };
    body.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{ ck.slot=b.dataset.slot; ck.err=""; ck.maisDatas=false; renderCheckout(); });
    if ($("mais-datas")) $("mais-datas").onclick=()=>{ ck.maisDatas=!ck.maisDatas; renderCheckout(); };
    body.querySelectorAll("[data-pag]").forEach(b=>b.onclick=()=>{ ck.pag=b.dataset.pag; ck.err=""; renderCheckout(); });
    body.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>fechar("ck-scrim"));
    // campos: guardam no estado sem redesenhar a tela (não perde o foco)
    body.querySelectorAll("[data-d]").forEach(i => i.oninput = () => { D[i.dataset.d] = i.value; saveDados(); if (i.dataset.d==="bairro"||i.dataset.d==="cidade") renderFrete(); });
    const cep = $("d-cep");
    if (cep) {
      cep.addEventListener("input", async () => {
        const c = cep.value.replace(/\D/g,"");
        if (c.length===8) cep.value = c.slice(0,5)+"-"+c.slice(5);
        D.cep = cep.value; saveDados();
        if (c.length!==8) return;
        const r = await GEO.cep(c);
        if (!r) { toast("CEP não encontrado. Preencha a rua e a cidade."); return; }
        D.rua = r.logradouro || D.rua; D.bairro = r.bairro || D.bairro; D.cidade = r.localidade || D.cidade; D.uf = r.uf || D.uf; saveDados();
        $("d-rua").value = D.rua; $("d-bairro").value = D.bairro; $("d-cidade").value = D.cidade; renderFrete();
        if (D.num) calcularFrete(); else $("d-num").focus();
      });
      ["d-num","d-rua","d-cidade"].forEach(id => $(id).addEventListener("change", calcularFrete));
    }
    $("ck-total").textContent = brl(subtotal()+taxa());
    $("ck-send").firstElementChild.textContent = ck.pag==="Pix" ? "Enviar e pagar com Pix" : "Enviar pedido pelo WhatsApp";
  }

  function enderecoTexto(){
    return `${D.rua.trim()}, ${D.num.trim()}${D.comp.trim()?` (${D.comp.trim()})`:""} – ${D.bairro.trim()}, ${D.cidade.trim()}${D.cep?` – CEP ${D.cep}`:""}`;
  }
  // celular só com números, sem o 55 e sem o 0 da operadora
  function telDigitos(){
    let d = D.tel.replace(/\D/g,"");
    if (d.length>=12 && d.startsWith("55")) d = d.slice(2);
    if (d.length===12 && d.startsWith("0")) d = d.slice(1);
    return d;
  }
  function faltando(){
    if (!cart.length) return "Seu carrinho está vazio.";
    if (!ck.modo) return "Escolha entrega ou retirada.";
    if (!ck.slot) return "Escolha o dia e o horário.";
    if (D.nome.trim().length<2) return "Preencha seu nome.";
    const tel = telDigitos();
    if (tel.length<10) return "Preencha seu celular com DDD.";
    if (tel.length>11 || (tel.length===11 && tel[2]!=="9")) return "Confira seu celular: são o DDD e mais 9 dígitos, começando com 9.";
    if (tel.slice(0,2)!=="19" && ck.telConfirmado!==tel) { ck.telConfirmado = tel; return `Seu celular está com DDD ${tel.slice(0,2)}: (${tel.slice(0,2)}) ${tel.slice(2,-4)}-${tel.slice(-4)}. É por ele que a gente fala com você sobre o pedido. Se estiver certo, toque em enviar de novo.`; }
    if (ck.modo==="Entrega") {
      if (!D.rua.trim() || !D.num.trim() || !D.cidade.trim()) return "Preencha o endereço de entrega (CEP, rua, número e cidade).";
      if (ck.frete.estado==="calc") return "Aguarde o cálculo da entrega.";
      const rg = regional();
      if (rg && !cidadeOk(rg)) return `Esse dia é só para entregas em ${cidadesTxt(rg)}. Escolha outra data.`;
      if (!rg && ck.frete.estado==="fora" && !gratis()) return "Esse endereço está fora da área de entrega.";
    }
    if (!ck.pag) return "Escolha a forma de pagamento.";
    if (!CFG.whatsapp) return "O WhatsApp da loja ainda não foi configurado.";
    return "";
  }

  // mensagem no mesmo formato do Goomer, com a data de entrega em destaque
  function mensagem(r, sel){
    const SEP = "---------------------------------------";
    const hora = new Date().toLocaleTimeString("pt-BR", { timeZone:"America/Sao_Paulo", hour:"2-digit", minute:"2-digit" });
    const site = location.origin + "/?utm_source=whatsapp";
    const escolha = o => o.split(";").map(x => x.split(":").pop().trim()).filter(Boolean);
    const L = [];
    L.push("⭐ *GOSTOU DE PEDIR NO NOSSO SITE?* ⭐");
    L.push("Não precisa baixar nada: adicione a Cacio & Pepe na tela inicial do seu celular e peça com mais agilidade na próxima vez pelo link abaixo:");
    L.push(site);
    L.push(SEP, "Confira o pedido abaixo:");
    L.push(`*Pedido #${String(r.numero).padStart(4,"0")}* - _Cacio & Pepe_`);
    L.push(SEP, "");
    L.push(`*${ck.modo==="Entrega" ? "ENTREGA" : "RETIRADA"}: ${U.diaLongo(sel.data).toUpperCase()}*`);
    L.push(`${sel.turno}${sel.horario ? ` (${sel.horario})` : ""}${r.tipo==="extra" ? " · venda extra do dia" : ""}`);
    L.push("", SEP, "");
    r.itens.forEach(i => {
      L.push(`*${i.qtd}x ${i.nome.toUpperCase()}*  `);
      if (i.opcao) escolha(i.opcao).forEach(e => L.push(/\bunidades?\b/i.test(e) ? ` - ${e}${i.qtd>1?` (cada)`:""}   ` : ` - ${i.qtd}x ${e}   `));
      if (i.obs) L.push(` - Obs: ${i.obs}`);
      L.push("");
    });
    L.push(`*Subtotal:* ${brl(r.subtotal)}`);
    if (ck.modo==="Entrega") {
      const taxa = r.frete_gratis ? "Grátis" : r.frete_combinar ? "A combinar" : brl(r.taxa_entrega);
      L.push(`*Taxa de entrega*:  ${taxa}`);
    }
    L.push(`*Total: ${brl(r.total)}*${r.frete_combinar ? " + entrega" : ""}`);
    L.push("", SEP, "");
    L.push(`*${D.nome.trim()}*`);
    L.push(D.tel.trim());
    L.push("");
    if (ck.modo==="Entrega") {
      L.push(`${D.rua.trim()}, ${D.num.trim()}${D.comp.trim() ? ` - ${D.comp.trim()}` : ""}`);
      L.push(`${D.bairro.trim()}, ${D.cidade.trim()}${D.uf ? `/${D.uf}` : ""}`);
      if (D.cep) L.push(D.cep);
    } else {
      L.push(`Retirada: ${endPub()}`);
    }
    L.push("");
    const pag = ck.pag==="Pix" ? "Pix (comprovante em anexo)" : ck.pag;
    L.push(`*Pagamento:* ${pag}${ck.pag==="Dinheiro" && D.troco.trim() ? ` (troco para R$ ${D.troco.trim()})` : ""} `);
    if (D.obs.trim()) L.push(`*Observação:* ${D.obs.trim()}`);
    L.push("", `_Pedido feito pelo site às ${hora}_`);
    return L.join("\n");
  }

  let enviando = false;
  $("ck-send").onclick = async () => {
    if (enviando) return;
    const f = faltando();
    if (f) { ck.err = f; $("ck-err").textContent = f; $("ck-err").scrollIntoView({behavior:"smooth",block:"center"}); return; }
    const sel = SLOTS.find(s=>s.data+"|"+s.janela_id===ck.slot);
    enviando = true; $("ck-send").setAttribute("aria-disabled","true"); $("ck-send").firstElementChild.textContent = "Reservando seu pedido…";
    const { data:r, error } = await sb.rpc("criar_pedido", {
      p_data: sel.data, p_janela: sel.janela_id,
      p_itens: cart.map(l=>({ produto_id:l.produto_id, opcao:l.opcao, obs:l.obs, qtd:l.qtd })),
      p_modo: ck.modo, p_nome: D.nome.trim(), p_telefone: D.tel.trim(), p_endereco: ck.modo==="Entrega" ? enderecoTexto() : "",
      p_pagamento: ck.pag, p_troco: ck.pag==="Dinheiro" ? D.troco.trim() : "", p_obs: D.obs.trim(),
      p_km: ck.modo==="Entrega" && (ck.frete.estado==="ok" || ck.frete.estado==="fora") ? Math.round(ck.frete.km*10)/10 : null,
      p_bairro: ck.modo==="Entrega" ? D.bairro.trim() : "", p_cep: ck.modo==="Entrega" ? (D.cep||"") : "",
      p_lat: ck.modo==="Entrega" ? (ck.frete.cli?.lat ?? null) : null, p_lng: ck.modo==="Entrega" ? (ck.frete.cli?.lng ?? null) : null,
    });
    enviando = false; $("ck-send").removeAttribute("aria-disabled");
    if (error) { ck.err = U.erro(error); await atualizarAgenda(); renderCheckout(); $("ck-err").scrollIntoView({behavior:"smooth",block:"center"}); return; }

    const msg = mensagem(r, sel);
    const link = `https://wa.me/${CFG.whatsapp.replace(/\D/g,"")}?text=${encodeURIComponent(msg)}`;
    const pix = ck.pag==="Pix", ck_pag = ck.pag;
    cart = []; saveCart(); renderCartBar(); ck.slot = null; ck.err = ""; ck.finalizado = true; D.obs = ""; D.troco = "";
    $("ck-foot").hidden = true;
    $("ck-title").textContent = "Pedido reservado";

    if (pix) {
      const code = PIX.payload({ chave:CFG.pix_chave, nome:CFG.pix_nome, cidade:CFG.pix_cidade, valor:r.frete_combinar?0:Number(r.total), txid:`CP${r.numero}` });
      const qr = qrcode(0, "M"); qr.addData(code); qr.make();
      $("ck-body").innerHTML = `<div class="gutter done">
        <div class="num">#${r.numero}</div>
        <h3>Pedido reservado</h3>
        <p>Para <b>${U.diaLongo(sel.data)}, ${esc(sel.turno.toLowerCase())}</b>. Faltam dois passos.</p>
        <div class="step"><h4>1. Envie o pedido no WhatsApp</h4>
          <p>É por essa mensagem que a gente confirma seu pedido e combina a entrega. Depois de enviar, volte aqui para pagar.</p>
          <a class="btn btn-primary" id="ck-wa" href="${esc(link)}" target="_blank" rel="noopener">Enviar pedido no WhatsApp</a>
        </div>
        <div class="step pix-trava" id="ck-pix">
          <h4>2. Pague ${r.frete_combinar?"":brl(r.total)+" "}com Pix e mande o comprovante na mesma conversa</h4>
          <div class="trava-msg" id="ck-trava">Envie o pedido no WhatsApp primeiro. O Pix aparece aqui em seguida.</div>
          <div class="pix-corpo">
            <div class="qr">${qr.createSvgTag({ cellSize:4, margin:2, scalable:true })}</div>
            <div class="copia" id="pix-code">${esc(code)}</div>
            <button class="btn btn-ghost" type="button" id="pix-copy">Copiar código Pix</button>
            ${r.frete_combinar?`<p>O valor fica em aberto porque a entrega será combinada no WhatsApp.</p>`:""}
          </div>
        </div>
        <button class="btn btn-ghost" type="button" data-close>Voltar ao cardápio</button>
      </div>`;
      const liberarPix = () => { $("ck-pix").classList.remove("pix-trava"); $("ck-trava").hidden = true; };
      $("ck-wa").addEventListener("click", () => setTimeout(liberarPix, 300));
      $("pix-copy").onclick = async () => {
        try { await navigator.clipboard.writeText(code); toast("Código Pix copiado"); }
        catch(e) { const rg=document.createRange(); rg.selectNodeContents($("pix-code")); const s=getSelection(); s.removeAllRanges(); s.addRange(rg); toast("Selecionado. Copie o código."); }
      };
    } else if (ck_pag===PG_LINK) {
      $("ck-body").innerHTML = `<div class="gutter done">
        <div class="num">#${r.numero}</div>
        <h3>Pedido reservado</h3>
        <p>Para <b>${U.diaLongo(sel.data)}, ${esc(sel.turno.toLowerCase())}</b>. Faltam dois passos.</p>
        <div class="step"><h4>1. Envie o pedido no WhatsApp</h4>
          <p>É por essa mensagem que a gente confirma seu pedido e combina a entrega. Depois de enviar, volte aqui para pagar.</p>
          <a class="btn btn-primary" id="ck-wa" href="${esc(link)}" target="_blank" rel="noopener">Enviar pedido no WhatsApp</a>
        </div>
        <div class="step pix-trava" id="ck-pix">
          <h4>2. Pague ${r.frete_combinar?"":brl(r.total)+" "}${TEM_APPLE_PAY?"com Apple Pay ou cartão":"no cartão"}</h4>
          <div class="trava-msg" id="ck-trava">Envie o pedido no WhatsApp primeiro. O pagamento libera aqui em seguida.</div>
          <div class="pix-corpo">
            <p>Você vai para a página segura da InfinitePay${TEM_APPLE_PAY?" (no Apple Pay, é só tocar no botão dele lá e confirmar com Face ID)":", com crédito ou débito"}. Quando terminar, volta pra cá sozinho.</p>
            <div class="pagar-btns">
              ${TEM_APPLE_PAY?`<button class="btn btn-apple" type="button" data-pagar>Pagar com <span class="ap"></span>Pay</button>`:""}
              <button class="btn ${TEM_APPLE_PAY?"btn-ghost":"btn-primary"}" type="button" data-pagar>Pagar ${r.frete_combinar?"":brl(r.total)+" "}com cartão</button>
            </div>
          </div>
        </div>
        <button class="btn btn-ghost" type="button" data-close>Voltar ao cardápio</button>
      </div>`;
      $("ck-wa").addEventListener("click", () => setTimeout(() => { $("ck-pix").classList.remove("pix-trava"); $("ck-trava").hidden = true; }, 300));
      $("ck-body").querySelectorAll("[data-pagar]").forEach(b => b.onclick = async () => {
        const todos = $("ck-body").querySelectorAll("[data-pagar]"); todos.forEach(x => x.disabled = true);
        const rotulo = b.innerHTML; b.textContent = "Abrindo pagamento…";
        const { data, error } = await sb.functions.invoke("infinitepay", { body:{ pedido_id:r.id } });
        let msg = data?.erro; if (error) { try { msg = (await error.context.json()).erro; } catch(e) {} }
        if (data?.url) { location.href = data.url; return; }
        todos.forEach(x => x.disabled = false); b.innerHTML = rotulo; toast(msg || "Não deu para abrir o pagamento agora. A gente te manda o link no WhatsApp.");
      });
    } else {
      $("ck-body").innerHTML = `<div class="gutter done">
        <div class="num">#${r.numero}</div>
        <h3>Falta só mandar no WhatsApp</h3>
        <p>Seu pedido para <b>${U.diaLongo(sel.data)}, ${esc(sel.turno.toLowerCase())}</b> está reservado. Envie a mensagem no WhatsApp para a gente confirmar. Se ela não abriu sozinha, toque no botão.</p>
        <a class="btn btn-primary" href="${esc(link)}" target="_blank" rel="noopener">Abrir WhatsApp com o pedido</a>
        <button class="btn btn-ghost" type="button" data-close>Voltar ao cardápio</button>
      </div>`;
      setTimeout(() => { window.location.href = link; }, 400);
    }
    $("ck-body").querySelector("[data-close]").onclick = () => fechar("ck-scrim");
    atualizarAgenda();
  };

  // ---------- folhas ----------
  let ultimoFoco = null;
  function abrir(id){ ultimoFoco=document.activeElement; $(id).hidden=false; document.body.style.overflow="hidden"; $(id).querySelector("[data-close]")?.focus(); }
  function fechar(id){ $(id).hidden=true; if($("pd-scrim").hidden && $("ck-scrim").hidden) document.body.style.overflow=""; ultimoFoco?.focus?.(); if(id==="ck-scrim"){ $("ck-title").textContent="Meu pedido"; ck.finalizado=false; } }
  ["pd-scrim","ck-scrim"].forEach(id=>{
    $(id).addEventListener("click", e => { if (e.target.id===id || e.target.closest(".sheet-head [data-close]")) fechar(id); });
  });
  document.addEventListener("keydown", e => { if(e.key==="Escape"){ if(!$("pd-scrim").hidden) fechar("pd-scrim"); else if(!$("ck-scrim").hidden) fechar("ck-scrim"); } });

  carregar();
  // voltou do link de pagamento da InfinitePay
  (() => { const q = new URLSearchParams(location.search); const n = q.get("pago");
    if (n && /^\d+$/.test(n)) { setTimeout(() => { toast(`Pagamento do pedido #${n} recebido. Obrigado! 🧡`); toast._t && clearTimeout(toast._t); toast._t = setTimeout(()=>$("toast").hidden=true, 6000); }, 600);
      try { history.replaceState(null, "", location.pathname); } catch(e) {} } })();
  setInterval(atualizarAgenda, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) atualizarAgenda(); });
})();
</script>
</body>
</html>
