<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Produzione — Cacio & Pepe</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="painel.webmanifest">
<meta name="theme-color" content="#5C1824">
<link rel="apple-touch-icon" href="icon-maskable-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Produzione">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="base.css">
<style>
body{background:var(--bg)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding-block:40px}
.login form{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.login h1{font-family:var(--display);font-weight:400;font-size:34px;margin:0;line-height:1}
.login p{margin:0;color:var(--muted);font-size:14px}
.swap{all:unset;cursor:pointer;color:var(--vinho);font-weight:600;font-size:14px}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--hero)}
.top-in{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-weight:400;font-size:22px;margin:0;flex:none}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;font-weight:600;white-space:nowrap;opacity:.8}
.tabs button[aria-selected="true"]{background:rgba(255,255,255,.18);opacity:1}
.tabs button:focus-visible{outline:2px solid currentColor}
.badge{background:var(--mortadela);color:var(--on-mortadela);border-radius:999px;font-size:11px;padding:1px 7px;margin-left:4px}
.out{all:unset;cursor:pointer;font-size:13px;opacity:.85}

main{padding-block:22px 60px;display:flex;flex-direction:column;gap:18px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0}
.note{color:var(--muted);font-size:13px;margin:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.day-h{font-weight:800;margin:8px 0 -4px}
.day-h::first-letter{text-transform:uppercase}

.jh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.jh>div{min-width:0}
.jh .pill{white-space:nowrap;flex:none}
.jh b{font-size:17px}
.jh small{display:block;color:var(--muted);font-size:13px}
.meter{height:10px;border-radius:999px;background:var(--paper);overflow:hidden}
.meter span{display:block;height:100%;background:var(--vinho)}
.meter.full span{background:var(--danger)}
.mtxt{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums}
.mtxt b{font-size:15px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl label,.fl span.l{font-size:12px;font-weight:600;color:var(--muted)}
.fl .input{padding:9px 10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;cursor:pointer}
.toggle input{width:42px;height:24px;appearance:none;background:var(--line);border-radius:999px;position:relative;cursor:pointer;flex:none;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle input:checked{background:var(--vinho)}
.toggle input:checked::after{transform:translateX(18px)}
.toggle small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.demand{background:var(--paper);border-radius:var(--r-sm);padding:10px 12px;font-size:13px}
.demand b{font-variant-numeric:tabular-nums}
.demand ul{margin:4px 0 0;padding-left:18px}
.row-act{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.row-act .btn{padding:10px 16px}
.saved{font-size:13px;color:var(--ok);font-weight:600}

.global{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.global.on{background:var(--mortadela);color:var(--on-mortadela);border-color:transparent}

/* pedidos */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--vinho)}
.ped .ph{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ped .num{font-family:var(--display);font-size:24px;line-height:1}
.ped .who{font-weight:700}
.ped .meta{font-size:13px;color:var(--muted)}
.ped a{color:var(--vinho);font-weight:600}
.ped ul{margin:0;padding-left:18px;font-size:14px}
.ped ul small{color:var(--muted)}
.ped .tot{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:10px}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st.aguardando{background:var(--mortadela);color:var(--on-mortadela)}
.st.confirmado{background:var(--pistache);color:var(--on-pistache)}
.st.entregue{background:var(--ink);color:var(--bg)}
.st.cancelado{background:var(--paper);color:var(--muted);text-decoration:line-through}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts .btn{padding:8px 12px;font-size:13px}
.btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--line)}
.ped.cancelado{opacity:.6}

.wait{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.wait.late{color:var(--danger)}
.combo{background:var(--pistache);color:var(--on-pistache);border-radius:var(--r-sm);padding:6px 10px;font-size:14px}
.nota{border-left:3px solid var(--line);padding:2px 10px;font-size:13px;color:var(--muted);font-style:italic}
.btn-wa,.ped a.btn-wa{background:#1F8F4E;color:#fff;text-decoration:none}
.it-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:6px 14px}
.it-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;min-width:0}
.it-row small{color:var(--muted)}
.it-row .it-q{width:72px;flex:none;padding:7px 8px}
#f-novo{border:2px solid var(--vinho)}
/* cardápio */
.pe summary{cursor:pointer;display:flex;gap:12px;align-items:center;list-style:none}
.pe summary::-webkit-details-marker{display:none}
.pe .mini{width:52px;height:52px;border-radius:var(--r-sm);background:var(--paper);overflow:hidden;flex:none}
.pe .mini img{width:100%;height:100%;object-fit:cover}
.pe .sn{flex:1;min-width:0}
.pe .sn b{display:block}
.pe .sn small{color:var(--muted)}
.pe[open] summary{padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.pe .body{display:flex;flex-direction:column;gap:12px}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph-i{position:relative;width:96px;height:96px;border-radius:var(--r-sm);overflow:hidden;background:var(--paper)}
.ph-i img{width:100%;height:100%;object-fit:cover}
.ph-i .ctl{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;background:rgba(0,0,0,.55)}
.ph-i .ctl button{all:unset;cursor:pointer;color:#fff;font-size:13px;padding:3px 7px}
.ph-i .first{position:absolute;top:4px;left:4px;background:var(--vinho);color:var(--on-vinho);font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px}
.up{width:96px;height:96px;border:1.5px dashed var(--line);border-radius:var(--r-sm);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;padding:6px}
.up input{display:none}
.og{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;display:flex;flex-direction:column;gap:8px}
.og-h{display:flex;gap:8px;align-items:center}
.og-h .input{flex:1}
.small-btn{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--vinho)}
.small-btn.rm{color:var(--danger)}
.small-btn:focus-visible{outline:2px solid var(--vinho)}

/* estoque, compras, financeiro */
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.aviso{background:var(--mortadela);color:var(--on-mortadela);border-color:transparent}
.aviso .note{color:inherit}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-size:22px;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)} .neg{color:var(--danger)}
.pill.bad{background:var(--mortadela);color:var(--on-mortadela)}
.pill.warnp{background:#F3E2B8;color:#5E4206}
:root[data-theme="dark"] .pill.warnp{background:#4A3A12;color:#F0D9A0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.warnp{background:#4A3A12;color:#F0D9A0}}
.lista{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.card.tbl{padding:0;overflow-x:auto}
table.est,table.fin{border-collapse:collapse;width:100%;min-width:640px;font-size:14px;font-variant-numeric:tabular-nums}
table.est th,table.fin th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
table.est td,table.fin td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
table.est tbody tr:first-child td,table.fin tbody tr:first-child td{border-top:0}
table.est .cnt{width:110px;padding:7px 8px;display:inline-block}
.mes{display:flex;align-items:center;gap:6px;font-size:16px}
.mes b{min-width:150px;text-align:center}
.icon-btn{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:22px;border:1px solid var(--line);background:var(--surface)}
.icon-btn:focus-visible{outline:2px solid var(--vinho)}
details.card summary{cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary small{display:block;color:var(--muted);font-size:13px}
.itens-compra{display:flex;flex-direction:column;gap:8px}
.ic{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.2fr) minmax(0,1fr) 100px auto;gap:8px;align-items:center;padding:8px;border-radius:var(--r-sm);border:1px solid var(--line)}
.ic.sug{border-color:var(--warn);border-style:dashed}
.ic-q{display:flex;align-items:center;gap:6px;min-width:0}
.ic-q .input{min-width:0;flex:1}
.ficha{display:flex;flex-direction:column;gap:6px}
.fr{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) 80px auto;gap:8px;align-items:center}
.ficha-custos{display:flex;flex-wrap:wrap;gap:10px}
.ficha-custos div{background:var(--paper);border-radius:var(--r-sm);padding:8px 12px;display:flex;flex-direction:column;min-width:120px}
.ficha-custos span{font-size:12px;color:var(--muted)}
.ficha-custos b{font-size:18px;font-variant-numeric:tabular-nums}
.ficha-custos small{font-size:12px;font-weight:700}
@media (max-width:640px){
  .ic{grid-template-columns:minmax(0,1fr) auto}
  .ic > :nth-child(-n+3){grid-column:1/-1}
  .fr{grid-template-columns:1fr 1fr}
  .fr > :first-child{grid-column:1/-1}
}
@media (max-width:640px){
  .top-in{gap:8px 12px}
  .tabs{order:3;flex-basis:100%;margin-inline:-4px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi b{font-size:18px}
  .card.tbl table.est{min-width:0;display:block;width:100%}
  table.est thead{display:none}
  table.est tbody,table.est tr,table.est td{display:block}
  table.est tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;padding:12px 14px;border-top:1px solid var(--line)}
  table.est tbody tr:first-child{border-top:0}
  table.est td{padding:0;border:0}
  table.est td:first-child,table.est td.st-cel{grid-column:1/-1}
  table.est td[data-l]:not([data-l=""])::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted);font-weight:600}
  table.est td[data-l=""]{display:none}
  .card.tbl:has(table.est){overflow-x:visible}
}
/* celular: app com barra de abas embaixo */
.bnav,.mais,.mais-scrim{display:none}
@media (max-width:640px){
  html{-webkit-text-size-adjust:100%}
  body::before{display:none}
  .top{position:static;padding-top:env(safe-area-inset-top,0px)}
  .top-in{padding-block:12px 14px}
  .top h1{font-size:22px}
  .top .tabs,.top .out{display:none}
  .login{padding-top:calc(40px + env(safe-area-inset-top,0px))}
  main{padding-block:16px calc(100px + env(safe-area-inset-bottom,0px));gap:14px}
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));box-shadow:0 -6px 20px rgba(60,25,20,.08)}
  .bnav button{all:unset;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;min-width:0}
  .bnav svg{width:24px;height:24px}
  .bnav button[aria-selected="true"],.bnav button.on,.bnav button[aria-expanded="true"]{color:var(--vinho)}
  .bnav button[aria-selected="true"]::before,.bnav button.on::before{content:"";position:absolute;top:-6px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--vinho)}
  .bnav button:focus-visible{outline:2px solid var(--vinho);border-radius:10px}
  .bnav .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0}
  .mais-scrim{display:block;position:fixed;inset:0;z-index:38;background:rgba(20,10,10,.35)}
  .mais{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:39;background:var(--surface);border-radius:22px 22px 0 0;
    padding:16px max(16px,env(safe-area-inset-right,0px)) calc(86px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
  .mais[hidden],.mais-scrim[hidden]{display:none}
  .mais button{all:unset;display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;background:var(--paper);font-weight:600;cursor:pointer}
  .mais button[aria-selected="true"]{background:var(--vinho);color:var(--on-vinho)}
  .mais svg{width:22px;height:22px;flex:none}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  /* campos com 16px: o iPhone não dá zoom ao tocar */
  .input,select.input,textarea.input,input,select,textarea{font-size:16px}
  .bar{flex-wrap:wrap;gap:10px}
  .bar h2{font-size:26px}
  .bar > .acts,.bar > .btn{width:100%}
  .bar > .acts .btn,.bar > .acts label.btn{flex:1}
  .bar > .filters,.filters{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;width:calc(100% + 32px)}
  .filters::-webkit-scrollbar{display:none}
  .filters .chip{flex:none}
  .mes{width:100%;justify-content:space-between}
  .day-h{margin-top:4px}
  .card{padding:14px}
  .f3,.f2{grid-template-columns:1fr}
  form[data-j] .f3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .acts .btn{padding:11px 14px}
  .row-act{flex-wrap:wrap}
  .card.tbl table.fin{min-width:0;display:block;width:100%}
  table.fin thead{display:none}
  table.fin tbody,table.fin td{display:block}
  table.fin tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 14px;border-top:1px solid var(--line)}
  table.fin tbody tr:first-child{border-top:0}
  table.fin td{padding:0;border:0}
  table.fin td:nth-child(1){grid-column:1;font-size:12px;color:var(--muted)}
  table.fin td:nth-child(2){grid-column:1;grid-row:2}
  table.fin td:nth-child(3){grid-column:1;grid-row:3;font-size:12px;color:var(--muted)}
  table.fin td:nth-child(4){grid-column:2;grid-row:1 / span 2;align-self:center;font-weight:700}
  table.fin td:nth-child(5){grid-column:2;grid-row:3;text-align:right}
  .kpi{padding:12px 14px}
  .kpi span{font-size:12px}
}
/* leitor de QR ao vivo */
.scanner{position:fixed;inset:0;z-index:100;background:#000;color:#fff;display:flex;flex-direction:column}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc-mira{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.sc-mira span{width:min(68vw,300px);aspect-ratio:1;max-width:100%;border-radius:22px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5);border:3px solid rgba(255,255,255,.9);transition:border-color .15s}
.scanner.ok .sc-mira span{border-color:#8BD17C}
.sc-top{position:relative;display:flex;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.sc-btn{all:unset;cursor:pointer;min-width:44px;height:44px;padding:0 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.sc-btn.on{background:#fff;color:#000}
.sc-btn:focus-visible{outline:2px solid #fff}
.sc-bot{position:relative;margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sc-bot p{margin:0;font-size:17px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.sc-foto{cursor:pointer;padding:12px 18px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);font-weight:600}
/* ajustes */
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px}
.tbl td{padding:6px;border-top:1px solid var(--line);vertical-align:middle}
.tbl .input{padding:8px}
.empty{color:var(--muted);text-align:center;padding:30px}
.err{color:var(--danger);font-size:14px;font-weight:600}
.err:empty{display:none}
@media (max-width:520px){.f3{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>

<!-- Login -->
<section class="login gutter" id="v-login" hidden>
  <form id="f-login" novalidate>
    <h1>Produzione</h1>
    <p id="login-sub">Painel da equipe Cacio &amp; Pepe.</p>
    <div class="fl"><label for="l-email">E-mail</label><input class="input" id="l-email" type="email" autocomplete="email" required></div>
    <div class="fl"><label for="l-senha">Senha</label><input class="input" id="l-senha" type="password" autocomplete="current-password" minlength="6" required></div>
    <div class="err" id="l-err" role="alert"></div>
    <button class="btn btn-primary" type="submit" id="l-btn">Entrar</button>

    <button type="button" data-tab="pedidos" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><span>Pedidos</span><span class="badge b-ped2" hidden></span></button>

    <button type="button" data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 110-4h.1a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V3a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg><span>Ajustes</span></button>
    <button type="button" id="out2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg><span>Sair</span></button>
  </div>
  <main class="wrap gutter">
    <section id="t-producao"></section>
    <section id="t-pedidos" hidden></section>
    <section id="t-estoque" hidden></section>
    <section id="t-compras" hidden></section>
    <section id="t-financeiro" hidden></section>
    <section id="t-cardapio" hidden></section>
    <section id="t-ajustes" hidden></section>
  </main>

<div class="toast" id="toast" hidden role="status"></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="jsQR.js"></script>
<script src="estoque.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const { brl, esc } = U;
  const ETAPAS = [["planejado","Planejado"],["massa","Massa"],["dobras","Dobras"],["fermentacao","Fermentação"],["modelagem","Modelagem"],["forno","Forno"],["pronto","Pronto"]];
  const DIA_OPTS = U.DIAS.map((d,i)=>[i,d]);
  let tab = "producao", CFG = null, JAN = [], PEDS = [], PRODS = [], JANELAS = [];
  let pedFiltro = "ativos", novos = 0;

  function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }
  const TABS = ["producao","pedidos","estoque","compras","financeiro","cardapio","ajustes"];
  const MOD = Modulos({ $, toast, cfg: () => CFG });
  addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== tab && !$("v-app").hidden) abrirTab(h); });
  function show(v){ ["v-login","v-noaccess","v-app"].forEach(x=>$(x).hidden = x!==v); }

  // ---------- autenticação ----------
  let modoCadastro = false;
  $("l-swap").onclick = () => {
    modoCadastro = !modoCadastro;
    $("l-btn").textContent = modoCadastro ? "Criar senha" : "Entrar";
    $("l-swap").textContent = modoCadastro ? "Já tenho senha" : "Primeiro acesso? Criar senha";
    $("login-sub").textContent = modoCadastro ? "Use o e-mail que foi liberado para o painel e escolha uma senha (mínimo 6 caracteres)." : "Painel da equipe Cacio & Pepe.";
    $("l-senha").autocomplete = modoCadastro ? "new-password" : "current-password";
    $("l-err").textContent = "";
  };
  $("f-login").onsubmit = async e => {
    e.preventDefault();
    const email = $("l-email").value.trim(), password = $("l-senha").value;
    if (!email || password.length < 6) { $("l-err").textContent = "Preencha e-mail e senha (mínimo 6 caracteres)."; return; }
    $("l-btn").disabled = true; $("l-err").textContent = "";
    const r = modoCadastro ? await sb.auth.signUp({ email, password, options:{ emailRedirectTo: location.origin + location.pathname } }) : await sb.auth.signInWithPassword({ email, password });
    $("l-btn").disabled = false;
    if (r.error) {
      const m = r.error.message || "";
      $("l-err").textContent = /invalid login/i.test(m) ? "E-mail ou senha incorretos." : /already registered/i.test(m) ? "Esse e-mail já tem senha. Use Entrar." : /confirm/i.test(m) ? "Confirme seu e-mail pelo link que enviamos e depois entre." : m;
      return;
    }
    if (modoCadastro && !r.data.session) { $("l-err").textContent = "Enviamos um link de confirmação para o seu e-mail. Confirme e depois entre aqui."; return; }
    iniciar();
  };
  async function sair(){ await sb.auth.signOut(); location.reload(); }
  $("out").onclick = sair; $("na-out").onclick = sair;

  async function iniciar(){
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) { show("v-login"); return; }
    const { data:eq } = await sb.rpc("entrar_por_convite");
    if (!eq) { $("na-txt").textContent = `Você entrou como ${session.user.email}, mas esse e-mail ainda não foi liberado. Peça para alguém da equipe adicionar em Ajustes → Equipe e crie a conta de novo, ou fale com o Caio.`; show("v-noaccess"); return; }
    show("v-app");
    await carregarBase();
    const h = location.hash.slice(1); if (TABS.includes(h)) tab = h;
    abrirTab(tab);
    aviseNotificacoes();
    tempoReal();
  }

  // ---------- dados ----------
  async function carregarBase(){
    const [c, j, p] = await Promise.all([
      sb.from("config").select("*").eq("id",1).single(),
      sb.from("janelas").select("*").order("ordem"),
      sb.from("produtos").select("*").order("ordem").order("nome"),
    ]);
    CFG = c.data; JANELAS = j.data || []; PRODS = p.data || [];
  }
  const hoje = () => U.hojeSP();
  async function carregarProducao(){
    const de = hoje(), ate = U.somaDias(de, 13);
    const [j, p] = await Promise.all([
      sb.rpc("painel_janelas", { p_de: de, p_ate: ate }),
      sb.from("pedidos").select("*").gte("data", de).lte("data", ate).neq("status","cancelado"),
    ]);
    if (j.error) { toast(U.erro(j.error)); return; }
    JAN = j.data || []; PEDS = p.data || [];
  }

  // ---------- abas ----------
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { fecharMais(); abrirTab(b.dataset.tab); });
  function fecharMais(){ $("mais").hidden = true; $("mais-scrim").hidden = true; $("b-mais").setAttribute("aria-expanded","false"); }
  $("b-mais").onclick = () => { const abre = $("mais").hidden; $("mais").hidden = !abre; $("mais-scrim").hidden = !abre; $("b-mais").setAttribute("aria-expanded", String(abre)); };
  $("mais-scrim").onclick = fecharMais;
  $("out2").onclick = () => sair();
  function badgePedidos(n){ document.querySelectorAll("#b-ped,.b-ped2").forEach(b => { b.textContent = n; b.hidden = !n; }); }
  function abrirTab(t){
    tab = t;
    document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab===t)));
    $("b-mais").classList.toggle("on", ["financeiro","cardapio","ajustes"].includes(t));
    scrollTo({ top:0 });
    TABS.forEach(x => $("t-"+x).hidden = x!==t);
    try { history.replaceState(null, "", "#"+t); } catch(e) {}
    if (matchMedia("(min-width:641px)").matches) document.querySelector(`.tabs button[data-tab="${t}"]`)?.scrollIntoView({ block:"nearest", inline:"center" });
    if (t==="pedidos") { novos = 0; badgePedidos(0); }
    ({ producao:renderProducao, pedidos:renderPedidos, estoque:MOD.renderEstoque, compras:MOD.renderCompras, financeiro:MOD.renderFinanceiro, cardapio:renderCardapio, ajustes:renderAjustes })[t]();
  }

  // ---------- PRODUÇÃO ----------
  function statusJanela(j){
    if (j.bloqueado) return `<span class="pill off">Vendas bloqueadas</span>`;
    if (j.modo==="regular") return `<span class="pill ok">Aberta até ${U.quando(j.corte)} ${U.hora(j.corte)}</span>`;
    if (j.modo==="extra") return `<span class="pill extra">Vendas extras abertas</span>`;
    return `<span class="pill off">Encomendas encerradas</span>`;
  }
  function demanda(j){
    const ps = PEDS.filter(p=>p.data===j.data && p.janela_id===j.janela_id);
    if (!ps.length) return `<div class="demand">Nenhum pedido ainda.</div>`;
    const cont = {};
    ps.forEach(p => p.itens.forEach(i => { const k = i.nome + (i.opcao?` — ${i.opcao.replace(/^[^:]+:\s*/,"")}`:""); cont[k]=(cont[k]||0)+i.qtd; }));
    const ag = ps.filter(p=>p.status==="aguardando").length;
    return `<div class="demand"><b>${ps.length}</b> pedido${ps.length>1?"s":""}${ag?` (${ag} aguardando confirmação)`:""}. Montar:<ul>${Object.entries(cont).map(([k,v])=>`<li><b>${v}×</b> ${esc(k)}</li>`).join("")}</ul></div>`;
  }
  async function renderProducao(){
    const el = $("t-producao");
    el.innerHTML = `<p class="note">Carregando…</p>`;
    await carregarProducao();
    const dias = {}; JAN.forEach(j => (dias[j.data] ||= []).push(j));
    el.innerHTML = `
      <div class="bar"><h2>Produção</h2><p class="note">A capacidade de cada horário usa os pães aprovados; sem aprovados, os planejados; sem nada, a capacidade padrão.</p></div>
      <div class="card global ${CFG.vendas_pausadas?"on":""}">
        <label class="toggle" style="flex:1"><span>Pausar todas as encomendas<small>O cardápio continua no ar, mas ninguém consegue pedir. Pedidos feitos continuam valendo.</small></span>
        <input type="checkbox" id="pausa" ${CFG.vendas_pausadas?"checked":""}></label>
      </div>
      ${Object.keys(dias).length?Object.entries(dias).map(([d,js])=>`<div class="day-h">${U.diaLongo(d)}</div><div class="grid">${js.map(cardJanela).join("")}</div>`).join(""):`<p class="empty">Nenhum horário de entrega nas próximas duas semanas. Confira os horários em Ajustes.</p>`}`;
    $("pausa").onchange = async e => {
      const { error } = await sb.from("config").update({ vendas_pausadas: e.target.checked }).eq("id",1);
      if (error) { toast(U.erro(error)); e.target.checked = !e.target.checked; return; }
      CFG.vendas_pausadas = e.target.checked; toast(e.target.checked ? "Encomendas pausadas" : "Encomendas retomadas"); renderProducao();
    };
    el.querySelectorAll("form[data-j]").forEach(f => f.onsubmit = salvarJanela);
  }
  function cardJanela(j){
    const k = `${j.data}|${j.janela_id}`; const id = k.replace(/[^a-z0-9]/gi,"_");
    const pct = j.capacidade ? Math.min(100, Math.round(j.reservados/j.capacidade*100)) : 100;
    const n = (v)=> v==null?"":v;
    return `<form class="card" data-j="${esc(k)}">
      <div class="jh"><div><b>${esc(j.turno)}</b><small>${j.horario?esc(j.horario)+" · ":""}corte ${U.quando(j.corte)} ${U.hora(j.corte)}</small></div>${statusJanela(j)}</div>
      <div class="meter ${j.livres<=0?"full":""}"><span style="width:${pct}%"></span></div>
      <div class="mtxt"><span><b>${j.reservados}</b> reservados</span><span><b>${j.livres}</b> livres de ${j.capacidade}</span></div>
      ${demanda(j)}
      <div class="f3">
        <div class="fl"><label for="pl_${id}">Planejados</label><input class="input" id="pl_${id}" name="pl" type="number" min="0" inputmode="numeric" value="${n(j.paes_planejados)}" placeholder="${j.capacidade_padrao}"></div>
        <div class="fl"><label for="ap_${id}">Aprovados</label><input class="input" id="ap_${id}" name="ap" type="number" min="0" inputmode="numeric" value="${n(j.paes_aprovados)}" placeholder="—"></div>
        <div class="fl"><label for="ds_${id}">Descartados</label><input class="input" id="ds_${id}" name="ds" type="number" min="0" inputmode="numeric" value="${j.paes_descartados||""}" placeholder="0"></div>
      </div>
      <div class="fl"><label for="et_${id}">Etapa da massa</label><select class="input" id="et_${id}" name="et">${ETAPAS.map(([v,l])=>`<option value="${v}" ${j.etapa===v?"selected":""}>${l}</option>`).join("")}</select></div>
      <label class="toggle"><span>Liberar vendas extras<small>Depois do corte, vende os pães livres.</small></span><input type="checkbox" name="ex" ${j.vendas_extras?"checked":""}></label>
      <label class="toggle"><span>Bloquear este horário<small>Para de vender sem cancelar pedidos.</small></span><input type="checkbox" name="bl" ${j.bloqueado?"checked":""}></label>
      <div class="fl"><label for="an_${id}">Anotação</label><input class="input" id="an_${id}" name="an" maxlength="200" value="${esc(j.anotacao)}" placeholder="Ex: forno 2 em manutenção"></div>
      <div class="row-act"><span class="saved" hidden>Salvo</span><button class="btn btn-primary" type="submit">Salvar</button></div>
    </form>`;
  }
  async function salvarJanela(e){
    e.preventDefault();
    const f = e.target; const [data, janela_id] = f.dataset.j.split("|");
    const num = v => v.trim()==="" ? null : Math.max(0, parseInt(v,10)||0);
    const row = { data, janela_id, paes_planejados:num(f.pl.value), paes_aprovados:num(f.ap.value), paes_descartados:num(f.ds.value)||0,
      etapa:f.et.value, vendas_extras:f.ex.checked, bloqueado:f.bl.checked, anotacao:f.an.value.trim(), atualizado_em:new Date().toISOString() };
    const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
    const { error } = await sb.from("producao").upsert(row);
    btn.disabled = false;
    if (error) { toast(U.erro(error)); return; }
    toast("Produção salva"); renderProducao();
  }

  // ---------- PEDIDOS ----------
  const STATUS = { aguardando:"Aguardando", confirmado:"Confirmado", entregue:"Entregue", cancelado:"Cancelado" };
  const CANAIS = { site:"Site", whatsapp:"WhatsApp", instagram:"Instagram", presencial:"Presencial", outro:"Outro" };
  let pedEdit = null, novoAberto = false, PEDS_LISTA = [];
  const jTurno = id => JANELAS.find(j=>j.id===id)?.turno || id;
  const janelasDoDia = d => d ? JANELAS.filter(j => j.ativo && j.dia_semana === U.parseData(d).dow) : [];
  const pagsTodas = () => [...new Set([...(CFG.pix_chave?["Pix"]:[]), "Pix", ...CFG.pagamentos])];
  function haQuanto(ts){
    const min = Math.max(0, Math.round((Date.now() - new Date(ts).getTime())/60000));
    if (min < 60) return `${min} min`;
    const h = Math.floor(min/60), m = min%60;
    return h < 24 ? `${h}h${m?String(m).padStart(2,"0"):""}` : `${Math.floor(h/24)} dia${h>=48?"s":""}`;
  }
  function telWa(t){ const d=(t||"").replace(/\D/g,""); return d.length>=10 && !d.startsWith("55") ? "55"+d : d; }
  function msgRecuperacao(p){
    const itens = p.itens.map(i=>`${i.qtd} ${i.nome}`).join(", ");
    const data = `${U.diaLongo(p.data)}, ${jTurno(p.janela_id).toLowerCase()}`;
    return (CFG.msg_recuperacao||"").replace(/\{nome\}/g, (p.nome||"").split(" ")[0]).replace(/\{data\}/g, data)
      .replace(/\{itens\}/g, itens).replace(/\{total\}/g, brl(p.total));
  }

  async function renderPedidos(){
    const el = $("t-pedidos");
    if (!el.innerHTML) el.innerHTML = `<p class="note">Carregando…</p>`;
    const de = U.somaDias(hoje(), -7);
    const { data, error } = await sb.from("pedidos").select("*").gte("data", de).order("data").order("janela_id").order("numero");
    if (error) { el.innerHTML = `<p class="err">${esc(U.erro(error))}</p>`; return; }
    PEDS_LISTA = data;
    const filtros = [["ativos","Ativos"],["aguardando","Aguardando"],["confirmado","Confirmados"],["entregue","Entregues"],["cancelado","Cancelados"],["todos","Todos"]];
    const lista = data.filter(p => pedFiltro==="todos" ? true : pedFiltro==="ativos" ? (p.status==="aguardando"||p.status==="confirmado") : p.status===pedFiltro);
    const ordem = { aguardando:0, confirmado:1, entregue:2, cancelado:3 };
    const grupos = {}; lista.forEach(p => (grupos[p.data+"|"+p.janela_id] ||= []).push(p));
    Object.values(grupos).forEach(ps => ps.sort((a,b)=> ordem[a.status]-ordem[b.status] || (a.status==="aguardando" ? new Date(a.criado_em)-new Date(b.criado_em) : a.numero-b.numero)));
    const parados = data.filter(p=>p.status==="aguardando").length;
    el.innerHTML = `
      <div class="bar"><h2>Pedidos</h2><button class="btn btn-primary" type="button" id="btn-novo">${novoAberto?"Fechar":"Novo pedido avulso"}</button></div>
      <div class="filters">${filtros.map(([v,l])=>`<button class="chip" type="button" data-f="${v}" aria-pressed="${pedFiltro===v}">${l}${v==="aguardando"&&parados?` (${parados})`:""}</button>`).join("")}</div>
      ${novoAberto?`<form class="card" id="f-novo">${formPedidoHTML(null)}</form>`:""}
      ${lista.length?Object.entries(grupos).map(([k,ps])=>{ const [d,j]=k.split("|"); const tot=ps.filter(p=>p.status!=="cancelado").reduce((a,p)=>a+Number(p.total),0);
        return `<div class="day-h">${U.diaLongo(d)} · ${esc(jTurno(j))} <span class="note">— ${ps.length} pedido${ps.length>1?"s":""}, ${brl(tot)}</span></div><div class="grid">${ps.map(p=> pedEdit===p.id ? `<form class="card" data-edit="${p.id}">${formPedidoHTML(p)}</form>` : cardPedido(p)).join("")}</div>`;}).join("")
        :`<p class="empty">Nenhum pedido nesse filtro.</p>`}`;
    $("btn-novo").onclick = () => { novoAberto = !novoAberto; pedEdit = null; renderPedidos(); };
    el.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { pedFiltro = b.dataset.f; renderPedidos(); });
    el.querySelectorAll("[data-act]").forEach(b => b.onclick = () => acaoPedido(b));
    el.querySelectorAll("[data-editar]").forEach(b => b.onclick = () => { pedEdit = b.dataset.editar; novoAberto = false; renderPedidos(); });
    if (novoAberto) ligarForm($("f-novo"), null);
    el.querySelectorAll("form[data-edit]").forEach(f => ligarForm(f, PEDS_LISTA.find(p=>p.id===f.dataset.edit)));
  }

  function ligarForm(f, p){
    const g = name => f.elements[name];
    const n = !p;
    const itensDoForm = () => [...f.querySelectorAll(".it-q")].map(i => ({ pr: PRODS.find(x=>x.id===i.dataset.pid), op: i.dataset.op, q: Math.max(0, parseInt(i.value,10)||0) })).filter(x=>x.q>0 && x.pr);
    const subtotal = () => n ? itensDoForm().reduce((a,x)=>a+x.q*Number(x.pr.preco),0) : Number(p.subtotal);
    const paesDoForm = () => n ? itensDoForm().reduce((a,x)=>a+x.q*(x.pr.paes_por_unidade??1),0) : p.paes;
    let capInfo = null;
    const preencherTurnos = () => {
      const js = janelasDoDia(g("data").value);
      const atual = g("janela_id").value || p?.janela_id;
      g("janela_id").innerHTML = js.length ? js.map(j=>`<option value="${esc(j.id)}" ${j.id===atual?"selected":""}>${esc(j.turno)}${j.horario?` (${esc(j.horario)})`:""}</option>`).join("") : `<option value="">Sem entrega nesse dia</option>`;
    };
    const verCapacidade = async () => {
      const d = g("data").value, j = g("janela_id").value; const box = f.querySelector("[data-cap]");
      if (!d || !j) { box.textContent = ""; capInfo = null; return; }
      const { data } = await sb.rpc("painel_janelas", { p_de:d, p_ate:d });
      capInfo = (data||[]).find(x=>x.janela_id===j) || null;
      atualizar();
    };
    const atualizar = () => {
      const ent = g("modo").value === "Entrega";
      f.querySelectorAll("[data-ent]").forEach(e => e.hidden = !ent);
      const taxa = ent ? Math.max(0, parseFloat(g("taxa_entrega").value)||0) : 0;
      f.querySelector("[data-total]").textContent = `Total: ${brl(subtotal()+taxa)}${n?` · ${paesDoForm()} ciabatta${paesDoForm()===1?"":"s"}`:""}`;
      const box = f.querySelector("[data-cap]");
      if (capInfo) {
        const proprio = (!n && p.status!=="cancelado" && p.data===g("data").value && p.janela_id===g("janela_id").value) ? p.paes : 0;
        const livres = capInfo.livres + proprio, precisa = paesDoForm();
        box.innerHTML = `Nesse turno: <b>${livres}</b> ciabatta${livres===1?"":"s"} livre${livres===1?"":"s"} de ${capInfo.capacidade}.`
          + (precisa > livres ? ` <b style="color:var(--danger)">Esse pedido passa da produção em ${precisa-livres}.</b> Dá pra lançar mesmo assim; ajuste os pães planejados em Produção.` : "");
      } else box.textContent = "";
    };
    preencherTurnos();
    g("data").addEventListener("change", () => { preencherTurnos(); verCapacidade(); });
    g("janela_id").addEventListener("change", verCapacidade);
    f.addEventListener("input", atualizar);
    f.querySelector("[data-cancel]")?.addEventListener("click", () => { pedEdit = null; renderPedidos(); });
    verCapacidade(); atualizar();

    f.onsubmit = async e => {
      e.preventDefault();
      const nome = g("nome").value.trim(); const data = g("data").value; const janela_id = g("janela_id").value;
      if (nome.length < 2) { toast("Coloque o nome do cliente."); return; }
      if (!data || !janela_id) { toast("Escolha uma data com entrega e o turno."); return; }
      const modo = g("modo").value; const ent = modo==="Entrega";
      const taxa = ent ? Math.max(0, parseFloat(g("taxa_entrega").value)||0) : 0;
      const comum = { nome, telefone:g("telefone").value.trim(), data, janela_id, horario_combinado:g("horario_combinado").value.trim(),
        modo, endereco: ent ? g("endereco").value.trim() : "", taxa_entrega:taxa, pagamento:g("pagamento").value,
        obs:g("obs").value.trim(), nota_interna:g("nota_interna").value.trim(), atualizado_em:new Date().toISOString() };
      const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
      let error;
      if (n) {
        const its = itensDoForm();
        if (!its.length) { toast("Coloque pelo menos um item."); btn.disabled=false; return; }
        const itens = its.map(x=>({ produto_id:x.pr.id, nome:x.pr.nome, opcao:x.op, qtd:x.q, preco:Number(x.pr.preco), obs:"" }));
        const sub = subtotal();
        ({ error } = await sb.from("pedidos").insert({ ...comum, canal:g("canal").value, itens, paes:paesDoForm(), subtotal:sub, total:sub+taxa,
          status:g("status").value, pago:g("pago").checked, tipo:"regular" }));
      } else {
        ({ error } = await sb.from("pedidos").update({ ...comum, total:Number(p.subtotal)+taxa, frete_gratis: taxa>0 ? "" : p.frete_gratis, frete_combinar: ent && taxa===0 && p.frete_combinar }).eq("id", p.id));
      }
      btn.disabled = false;
      if (error) { toast(U.erro(error)); return; }
      toast(n ? "Pedido lançado" : "Pedido atualizado");
      novoAberto = false; pedEdit = null; renderPedidos();
    };
  }

  async function acaoPedido(b){
    const id = b.dataset.id, a = b.dataset.act;
    if (a==="cancelar" && b.dataset.sure!=="1") { b.dataset.sure="1"; b.textContent="Toque de novo para cancelar"; setTimeout(()=>{ if(b.isConnected){ b.dataset.sure=""; b.textContent="Cancelar"; } },4000); return; }
    const patch = a==="pago" ? { pago: b.dataset.v==="true" } : { status: a==="cancelar" ? "cancelado" : a, cancelado_motivo: a==="cancelar" ? "Cancelado pela equipe" : "" };
    patch.atualizado_em = new Date().toISOString();
    b.disabled = true;
    const { error } = await sb.from("pedidos").update(patch).eq("id", id);
    if (error) { toast(U.erro(error)); b.disabled=false; return; }
    toast(a==="cancelar"?"Pedido cancelado, pães liberados":"Pedido atualizado"); renderPedidos();
  }

  setInterval(() => { if (tab==="pedidos" && !novoAberto && !pedEdit && !document.hidden) renderPedidos(); }, 60000);

  // ---------- tempo real ----------

      if (payload.eventType==="INSERT") { toast(`Novo pedido #${payload.new.numero} — ${payload.new.nome}`); if (tab!=="pedidos") { novos++; badgePedidos(novos); } }
      if (tab==="pedidos") { if (!novoAberto && !pedEdit) renderPedidos(); } else if (tab==="producao") renderProducao();

  function formProduto(p){
    const id = p.id;
    return `<details class="card pe" data-id="${id}">
      <summary><div class="mini">${p.fotos[0]?`<img src="${esc(p.fotos[0])}" alt="">`:""}</div>

  function ligarProduto(p){
    const box = document.querySelector(`details[data-id="${p.id}"]`); if (!box) return;
    const st = { fotos:[...p.fotos], opcoes: JSON.parse(JSON.stringify(p.opcoes||[])) };
    const drawFotos = () => {
      const ph = $("ph_"+p.id);
      ph.innerHTML = st.fotos.map((f,i)=>`<div class="ph-i"><img src="${esc(f)}" alt="">${i===0?`<span class="first">Capa</span>`:""}
        <div class="ctl"><button type="button" data-l="${i}" aria-label="Mover para a esquerda">←</button><button type="button" data-x="${i}" aria-label="Remover foto">✕</button><button type="button" data-r="${i}" aria-label="Mover para a direita">→</button></div></div>`).join("")
        + `<label class="up">+ Adicionar fotos<input type="file" accept="image/*" multiple></label>`;
      ph.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.l; if(i>0){ [st.fotos[i-1],st.fotos[i]]=[st.fotos[i],st.fotos[i-1]]; drawFotos(); } });
      ph.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.r; if(i<st.fotos.length-1){ [st.fotos[i+1],st.fotos[i]]=[st.fotos[i],st.fotos[i+1]]; drawFotos(); } });
      ph.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{ st.fotos.splice(+b.dataset.x,1); drawFotos(); });
      ph.querySelector("input[type=file]").onchange = async e => {
        const files = [...e.target.files]; if (!files.length) return;
        toast(`Enviando ${files.length} foto${files.length>1?"s":""}…`);
        for (const f of files) {
          const ext = (f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
          const path = `${p.id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
          const { error } = await sb.storage.from("fotos").upload(path, f, { cacheControl:"31536000", contentType:f.type });
          if (error) { toast("Falha ao enviar foto: "+U.erro(error)); continue; }
          st.fotos.push(sb.storage.from("fotos").getPublicUrl(path).data.publicUrl);
        }
        drawFotos(); toast("Fotos enviadas. Toque em Salvar produto.");
      };
    };
    const drawOps = () => {
      const og = $("og_"+p.id);
      og.innerHTML = st.opcoes.map((g,gi)=>`<div class="og">
        <div class="og-h"><input class="input" data-gn="${gi}" value="${esc(g.nome)}" placeholder="Nome do grupo (ex: Pesto)" aria-label="Nome do grupo">
          <label class="toggle" style="font-size:13px"><span>Obrigatório</span><input type="checkbox" data-go="${gi}" ${g.obrigatorio?"checked":""}></label></div>
        <input class="input" data-ge="${gi}" value="${esc((g.escolhas||[]).join(", "))}" placeholder="Escolhas separadas por vírgula" aria-label="Escolhas">
        <button class="small-btn rm" type="button" data-gx="${gi}" style="align-self:flex-start">Remover grupo</button></div>`).join("");
      og.querySelectorAll("[data-gn]").forEach(i=>i.oninput=()=>st.opcoes[+i.dataset.gn].nome=i.value);
      og.querySelectorAll("[data-go]").forEach(i=>i.onchange=()=>st.opcoes[+i.dataset.go].obrigatorio=i.checked);

  // ---------- AJUSTES ----------
  function tipoPix(k){ if(!k) return ""; if(k.startsWith("+55")) return "celular"; if(k.includes("@")) return "email"; if(/^\d{11}$/.test(k)) return "cpf"; return "aleatoria"; }

      <div class="row-act"><button class="small-btn rm" type="button" data-gdel style="margin-right:auto">Excluir regra</button><button class="btn btn-ghost" type="button" data-gsave>Salvar regra</button></div>

  // ---------- app no celular e notificações ----------
  const ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const instalado = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const temPush = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  let instalarEvt = null;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); instalarEvt = e; if ($("celular")) $("celular").innerHTML = celularHTML(), ligarCelular(); });
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
    navigator.serviceWorker.addEventListener("message", e => { if (e.data?.abrir && TABS.includes(e.data.abrir)) abrirTab(e.data.abrir); });
  }
  function celularHTML(){
    const perm = "Notification" in window ? Notification.permission : "indisponivel";
    let inst = "";
    if (!instalado()) inst = ehIOS
      ? `<p><b>Instalar no iPhone:</b> abra este painel no <b>Safari</b>, toque em <b>Compartilhar</b> (o quadrado com a seta) e depois em <b>Adicionar à Tela de Início</b>. Depois abra pelo ícone novo para ligar as notificações.</p>`
      : (instalarEvt ? `<button class="btn btn-ghost" type="button" id="cel-inst">Instalar o app neste celular</button>`
        : `<p><b>Instalar no Android:</b> no Chrome, toque nos três pontinhos e em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</p>`);
    let noti;
    if (!temPush()) noti = ehIOS && !instalado() ? `<p class="note">No iPhone, as notificações funcionam depois de instalar o app (iOS 16.4 ou mais novo).</p>` : `<p class="note">Este navegador não aceita notificações.</p>`;
    else if (perm === "denied") noti = `<p class="note">As notificações foram bloqueadas neste aparelho. Libere nas configurações do navegador (Notificações → Produzione) e volte aqui.</p>`;
    else noti = `<div class="acts"><button class="btn btn-primary" type="button" id="cel-noti">Ativar notificações de pedido</button><button class="btn btn-ghost" type="button" id="cel-teste">Enviar um teste</button></div>
      <p class="note" id="cel-st">${perm==="granted"?"Toque em ativar se este aparelho ainda não recebe.":"Cada celular precisa ativar uma vez."}</p>`;
    return `<b>Este celular</b>${instalado()?`<p class="note">App instalado.</p>`:""}${inst}${noti}`;
  }
  async function ativarNotificacoes(){
    try {
      const perm = await Notification.requestPermission();
      if (perm !== "granted") { toast("Sem permissão, as notificações não chegam."); return false; }
      const reg = await navigator.serviceWorker.ready;
      const key = Uint8Array.from(atob(CFG.vapid_publica.replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(CFG.vapid_publica.length/4)*4,"=")), c => c.charCodeAt(0));
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:key });
      const j = sub.toJSON();
      const { error } = await sb.from("push_inscricoes").upsert({ endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, aparelho:(navigator.userAgentData?.platform||navigator.platform||"").slice(0,60) });
      if (error) { toast(U.erro(error)); return false; }
      try { localStorage.setItem("cp_push", "1"); } catch(e) {}
      toast("Notificações ativadas neste celular"); return true;
    } catch (e) { toast("Não deu para ativar: " + (e.message||e)); return false; }
  }
  function ligarCelular(){
    $("cel-inst")?.addEventListener("click", async () => { if (instalarEvt) { instalarEvt.prompt(); instalarEvt = null; } });
    $("cel-noti")?.addEventListener("click", async () => { if (await ativarNotificacoes()) $("cel-st").textContent = "Pronto: os pedidos novos vão chegar aqui."; });
    $("cel-teste")?.addEventListener("click", async () => {
      const { data, error } = await sb.functions.invoke("push-pedido", { body:{ teste:true } });
      if (error) { toast("Não deu para enviar o teste."); return; }
      toast(data.enviados ? "Teste enviado. Deve chegar em segundos." : "Nenhum aparelho seu está inscrito. Toque em Ativar.");
    });
  }
  // lembrete discreto na Produção até o aparelho ativar
  function aviseNotificacoes(){
    let ok = false; try { ok = localStorage.getItem("cp_push")==="1" || localStorage.getItem("cp_push_x")==="1"; } catch(e) {}
    if (ok || !temPush() || Notification.permission === "denied") return;
    const b = document.createElement("div"); b.className = "card aviso"; b.id = "aviso-push";
    b.innerHTML = `<div class="jh"><span><b>Receba os pedidos no celular.</b> Ative as notificações neste aparelho.</span><span class="acts"><button class="btn btn-primary" type="button">Ativar</button><button class="small-btn" type="button">Agora não</button></span></div>`;
    const [at, nao] = b.querySelectorAll("button");
    at.onclick = async () => { if (await ativarNotificacoes()) b.remove(); };
    nao.onclick = () => { try { localStorage.setItem("cp_push_x","1"); } catch(e) {} b.remove(); };
    document.querySelector("main").prepend(b);
  }

        <div class="tbl"><table>
          <thead><tr><th>Dia</th><th>Turno</th><th>Horário mostrado</th><th>Corte (dias antes)</th><th>Corte (hora)</th><th>Capacidade padrão</th><th>Ativo</th><th></th></tr></thead>

    // imagens da marca

      el2.innerHTML = (url ? `<div class="ph-i" style="${k==="capa_url"?"width:160px":""}"><img src="${esc(url)}" alt=""><div class="ctl"><span></span><button type="button" data-x aria-label="Remover imagem">✕ Remover</button><span></span></div></div>` : "")
        + `<label class="up">${url?"Trocar":"+ Enviar imagem"}<input type="file" accept="image/*"></label>`;
      el2.querySelector("[data-x]")?.addEventListener("click", () => { marca[k] = ""; drawUp(k, box); });

      renderAjustes();
    };

    $("f-cfg").onsubmit = async e => {
      e.preventDefault();
      const tipo = $("c-pxt").value;
      const row = { whatsapp:$("c-wa").value.replace(/\D/g,""), aviso:$("c-av").value.trim(),
        pagamentos:$("c-pg").value.split(",").map(s=>s.trim()).filter(Boolean), endereco_retirada:$("c-ret").value.trim(),
        logo_url:marca.logo_url, capa_url:marca.capa_url,
        pix_chave: tipo ? PIX.normalizar(tipo, $("c-px").value) : "", pix_nome:$("c-pxn").value.trim()||"Cacio e Pepe",
        frete_modo:$("c-fm").value, taxa_entrega:Math.max(0,parseFloat($("c-tx").value)||0),
        frete_base:Math.max(0,parseFloat($("c-fb").value)||0), frete_km:Math.max(0,parseFloat($("c-fk").value)||0),
        frete_min:Math.max(0,parseFloat($("c-fmin").value)||0), frete_raio_km:Math.max(0,parseFloat($("c-fr").value)||0),
        expirar_horas:Math.max(0,parseFloat($("c-exp").value)||0), msg_recuperacao:$("c-rec").value.trim() };
      if (!row.pagamentos.length && !row.pix_chave) { toast("Coloque pelo menos uma forma de pagamento."); return; }
      if (tipo && !row.pix_chave.replace(/\D/g,"") && tipo!=="email" && tipo!=="aleatoria") { toast("Preencha a chave Pix."); return; }
      const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
      if (row.endereco_retirada !== CFG.endereco_retirada || CFG.loja_lat == null) {
        const c = await GEO.coords({ livre: row.endereco_retirada.replace(/\s*[–-]\s*/g, ", ") });
        row.loja_lat = c ? c.lat : null; row.loja_lng = c ? c.lng : null;
        if (!c) toast("Não achei o endereço da loja no mapa. Confira o texto (rua, número, cidade).");
      }
      const { data, error } = await sb.from("config").update(row).eq("id",1).select().single();
      btn.disabled = false;
      if (error) { toast(U.erro(error)); return; }
      CFG = data; toast("Loja salva");
      $("c-loc").textContent = CFG.loja_lat!=null ? "Localização no mapa encontrada." : "Localização no mapa não encontrada.";
      $("c-px").value = CFG.pix_chave;
    };
    el.querySelectorAll("[data-savej]").forEach(b => b.onclick = async () => {
      const tr = b.closest("tr"); const g = k => tr.querySelector(`[data-k="${k}"]`);
      const row = { dia_semana:+g("dia_semana").value, turno:g("turno").value.trim()||"Turno", horario:g("horario").value.trim(),
        corte_dias_antes:Math.max(0,parseInt(g("corte_dias_antes").value,10)||0), corte_hora:g("corte_hora").value||"11:00",
        capacidade_padrao:Math.max(0,parseInt(g("capacidade_padrao").value,10)||0), ativo:g("ativo").checked };
      const { error } = await sb.from("janelas").update(row).eq("id", tr.dataset.jid);
      if (error) { toast(U.erro(error)); return; }
      await carregarBase(); toast("Horário salvo");
    });
    $("add-j").onclick = async () => {
      const id = "j-" + Date.now().toString(36);
      const { error } = await sb.from("janelas").insert({ id, dia_semana:5, turno:"Novo turno", corte_dias_antes:0, corte_hora:"11:00", capacidade_padrao:10, ativo:false, ordem:JANELAS.length+1 });
      if (error) { toast(U.erro(error)); return; }
      await carregarBase(); renderAjustes();
    };
    $("f-conv").onsubmit = async e => {
      e.preventDefault();
      const nome = $("cv-nome").value.trim(), email = $("cv-email").value.trim().toLowerCase();
      if (!nome || !email) return;
      const { error } = await sb.from("equipe_convites").upsert({ email, nome });
      if (error) { toast(U.erro(error)); return; }
      toast("Acesso liberado"); renderAjustes();
    };
  }

  sb.auth.onAuthStateChange((ev) => { if (ev==="SIGNED_OUT") show("v-login"); });
  iniciar();
})();
</script>
</body>
</html>
